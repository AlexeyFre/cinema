<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Отключаем масштабирование для кинематографичного вида -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кино для двоих 🍿</title>
    
    <!-- Подключаем Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        /* БАЗОВЫЕ СТИЛИ И ОТКЛЮЧЕНИЕ PULL-TO-REFRESH */
        :root {
            --bg-color: #050505;
            --primary-color: #E50914;
            --text-color: #f1f1f1;
            --glass-bg: rgba(20, 20, 20, 0.85);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            
            /* Блокируем свайп для обновления страницы (pull-to-refresh) */
            overscroll-behavior-y: none;
            touch-action: none; 
        }

        * {
            box-sizing: border-box;
        }

        /* ЭКРАН ВХОДА */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            z-index: 1000;
            touch-action: auto; /* Разрешаем обычные тачи на экране входа */
        }

        .login-box {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
            max-width: 90%;
            width: 350px;
        }

        .login-box h1 { margin-bottom: 20px; font-weight: 300; }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
            cursor: pointer;
            font-size: 14px;
            color: #ccc;
        }
        
        .checkbox-label input { margin-right: 10px; width: 18px; height: 18px; }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        button:hover { background-color: #b20710; }

        /* ОСНОВНОЙ ЭКРАН С ВИДЕО */
        #app-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            background: black;
            object-fit: contain;
        }

        /* КНОПКА ПОЛНОЭКРАННОГО РЕЖИМА */
        #fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 100;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        #fullscreen-btn:hover { background: rgba(255, 255, 255, 0.2); }

        /* ПАНЕЛЬ АДМИНИСТРАТОРА */
        #admin-panel {
            display: none;
            position: absolute;
            top: 15px; left: 15px; right: 150px; /* Отступ справа для кнопки фуллскрина */
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            gap: 10px;
            backdrop-filter: blur(5px);
            align-items: center;
        }
        #admin-panel input[type="text"] { margin-bottom: 0; flex-grow: 1; touch-action: auto; }
        #admin-panel button { width: auto; padding: 10px 15px; }

        /* КНОПКА ЗАГРУЗКИ СУБТИТРОВ */
        .subtitles-wrapper {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 100;
        }
        .file-upload-label {
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .file-upload-label:hover { background: rgba(255,255,255,0.2); }
        input[type="file"] { display: none; }

        /* ПЛАВАЮЩАЯ КНОПКА ЧАТА */
        #chat-float-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 200;
            backdrop-filter: blur(10px);
            user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            transition: transform 0.1s;
        }
        #chat-float-btn:active { transform: scale(0.95); }

        /* ИНДИКАТОР НОВЫХ СООБЩЕНИЙ */
        #chat-badge {
            position: absolute;
            top: -2px; right: -2px;
            width: 16px; height: 16px;
            background: var(--primary-color);
            border-radius: 50%;
            display: none;
            border: 2px solid #222;
        }

        /* ОВЕРЛЕЙ ЧАТА */
        #chat-overlay {
            display: none;
            position: absolute;
            bottom: 100px;
            right: 30px;
            width: 320px;
            height: 400px;
            max-height: 70vh;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid #444;
            border-radius: 12px;
            backdrop-filter: blur(15px);
            z-index: 250;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            /* Разрешаем клики внутри чата */
            touch-action: auto; 
        }

        @media (max-width: 600px) {
            #chat-overlay {
                width: 90vw;
                right: 5vw;
                bottom: 90px;
                max-height: 50vh; /* Ограничение для горизонтального iPhone */
            }
        }

        #chat-header {
            padding: 12px 15px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            background: rgba(0,0,0,0.4);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        #chat-close { cursor: pointer; color: #aaa; font-size: 24px; line-height: 1; }
        #chat-close:hover { color: white; }

        #chat-messages {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Разрешаем вертикальный скролл внутри чата */
            touch-action: pan-y;
            overscroll-behavior-y: contain;
        }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg.my-msg { background: var(--primary-color); align-self: flex-end; border-bottom-right-radius: 2px;}
        .msg.other-msg { background: #333; align-self: flex-start; border-bottom-left-radius: 2px;}
        .msg-name { font-size: 11px; color: #bbb; margin-bottom: 4px; }

        #chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #444;
            background: rgba(0,0,0,0.5);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        #chat-input-area input {
            flex-grow: 1;
            padding: 10px 12px;
            border-radius: 20px;
            border: 1px solid #555;
            background: #222;
            color: white;
            outline: none;
            margin-bottom: 0;
            touch-action: auto;
        }
        #chat-input-area button {
            width: auto;
            margin-left: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Кино для двоих</h1>
            <input type="text" id="username" placeholder="Ваше имя (например, Зайка)">
            <!-- ПАРОЛЬ -->
            <input type="password" id="password" placeholder="Секретный пароль">
            <label class="checkbox-label">
                <input type="checkbox" id="isAdminCheck">
                Я Администратор (Владелец ПК)
            </label>
            <button onclick="login()">Войти 🍿</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="app-screen">
        
        <!-- Кнопка разворота на весь экран (Видна всем) -->
        <button id="fullscreen-btn" onclick="toggleFullscreen()">🔲 На весь экран</button>

        <!-- Панель управления видео (только для Админа) -->
        <div id="admin-panel">
            <input type="text" id="video-url" placeholder="Вставьте прямую ссылку на .mp4">
            <button onclick="loadVideo()">Загрузить</button>
        </div>

        <!-- Видеоплеер -->
        <video id="cinema-video" playsinline>
            Ваш браузер не поддерживает HTML5 видео.
        </video>

        <!-- Кнопка загрузки субтитров -->
        <div class="subtitles-wrapper">
            <label class="file-upload-label">
                + Субтитры (.vtt)
                <input type="file" accept=".vtt" id="subtitles-input" onchange="loadSubtitles(event)">
            </label>
        </div>

        <!-- Плавающая кнопка чата -->
        <div id="chat-float-btn">
            💬
            <div id="chat-badge"></div>
        </div>

        <!-- Оверлей чата -->
        <div id="chat-overlay">
            <div id="chat-header">
                <span>Чат</span>
                <span id="chat-close" onclick="toggleChat()">×</span>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Написать..." onkeypress="handleChatEnter(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        // ==========================================
        const CORRECT_PASSWORD = "love123";

        // Конфигурация Firebase (без изменений)
        const firebaseConfig = {
            apiKey: "AIzaSyBatXdgIXXW5c4VFibd24bhoAockReJPrE",
            authDomain: "our-cinema-20c0f.firebaseapp.com",
            databaseURL: "https://our-cinema-20c0f-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "our-cinema-20c0f",
            storageBucket: "our-cinema-20c0f.firebasestorage.app",
            messagingSenderId: "970156344935",
            appId: "1:970156344935:web:74ecce58fb40f4579636c2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const syncRef = db.ref('sync');
        const chatRef = db.ref('chat');

        let currentUser = "Аноним";
        let isAdmin = false;
        let isChatOpen = false;
        let lastKnownState = { isPlaying: false, time: 0 }; // Для строгого контроля зрителя
        
        const video = document.getElementById('cinema-video');
        const appScreen = document.getElementById('app-screen');

        // ==========================================
        // ЛОГИКА АВТОРИЗАЦИИ
        // ==========================================
        function login() {
            const passInput = document.getElementById('password').value;
            const nameInput = document.getElementById('username').value.trim();
            const adminCheck = document.getElementById('isAdminCheck').checked;

            if (passInput !== CORRECT_PASSWORD) {
                alert("Неверный пароль! 💔");
                return;
            }

            if (nameInput) currentUser = nameInput;
            isAdmin = adminCheck;

            document.getElementById('login-screen').style.display = 'none';
            appScreen.style.display = 'block';

            if (isAdmin) {
                video.controls = true;
                document.getElementById('admin-panel').style.display = 'flex';
                initAdminSync();
            } else {
                // Для Зрителя убираем контролы, но оставляем pointer-events, чтобы он мог использовать чат и фуллскрин
                video.controls = false; 
                initClientSync();
            }

            video.load();
            initChat();
        }

        // ==========================================
        // ПОЛНОЭКРАННЫЙ РЕЖИМ (ДЛЯ ОБОИХ)
        // ==========================================
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Пытаемся развернуть ВЕСЬ экран (Android / ПК), чтобы чат был виден
                if (appScreen.requestFullscreen) {
                    appScreen.requestFullscreen();
                } else if (appScreen.webkitRequestFullscreen) {
                    appScreen.webkitRequestFullscreen();
                } else if (video.webkitEnterFullscreen) {
                    // Резервный вариант для iPhone (iOS Safari).
                    // На iOS только само видео может стать полноэкранным (откроется нативный плеер Apple).
                    video.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // ==========================================
        // СИНХРОНИЗАЦИЯ ВИДЕО
        // ==========================================
        function loadVideo() {
            const url = document.getElementById('video-url').value;
            if(url) {
                video.src = url;
                syncRef.update({ videoUrl: url, time: 0, isPlaying: false });
            }
        }

        function initAdminSync() {
            video.addEventListener('play', () => syncRef.update({ isPlaying: true, time: video.currentTime }));
            video.addEventListener('pause', () => syncRef.update({ isPlaying: false, time: video.currentTime }));
            video.addEventListener('seeked', () => syncRef.update({ time: video.currentTime }));

            setInterval(() => {
                if (!video.paused) {
                    syncRef.update({ time: video.currentTime });
                }
            }, 3000);
        }

        function initClientSync() {
            syncRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                lastKnownState = data; // Сохраняем состояние для защиты от кликов зрителя

                if (data.videoUrl && video.src !== data.videoUrl) {
                    video.src = data.videoUrl;
                }

                if (Math.abs(video.currentTime - data.time) > 1.5) {
                    video.currentTime = data.time;
                }

                if (data.isPlaying && video.paused) {
                    let playPromise = video.play();
                    if (playPromise !== undefined) playPromise.catch(() => {});
                } else if (!data.isPlaying && !video.paused) {
                    video.pause();
                }
            });

            // Агрессивная защита: если зритель на iPhone в нативном полноэкранном режиме 
            // попытается поставить на паузу или перемотать — мы его отменяем.
            video.addEventListener('pause', () => {
                if (lastKnownState.isPlaying) {
                    video.play().catch(() => {});
                }
            });
            video.addEventListener('play', () => {
                if (!lastKnownState.isPlaying) {
                    video.pause();
                }
            });
            video.addEventListener('seeked', () => {
                if (Math.abs(video.currentTime - lastKnownState.time) > 1.5) {
                    video.currentTime = lastKnownState.time;
                }
            });
            
            // Предотвращаем клик по самому видео для паузы на ПК/Android
            video.addEventListener('click', (e) => {
                e.preventDefault();
            });
        }

        // ==========================================
        // ЛОГИКА СУБТИТРОВ (.VTT)
        // ==========================================
        function loadSubtitles(event) {
            const file = event.target.files[0];
            if (!file) return;

            const objectURL = URL.createObjectURL(file);
            let track = document.getElementById('custom-subtitles');
            if (!track) {
                track = document.createElement('track');
                track.id = 'custom-subtitles';
                track.kind = 'subtitles';
                track.label = 'Русский';
                track.srclang = 'ru';
                video.appendChild(track);
            }

            track.src = objectURL;
            track.default = true;

            setTimeout(() => {
                if(video.textTracks && video.textTracks.length > 0) {
                    video.textTracks[0].mode = 'showing';
                }
            }, 500);
        }

        // ==========================================
        // ЛОГИКА ЧАТА
        // ==========================================
        const messagesDiv = document.getElementById('chat-messages');
        const badge = document.getElementById('chat-badge');
        const chatOverlay = document.getElementById('chat-overlay');
        const chatInput = document.getElementById('chat-input');

        function toggleChat() {
            isChatOpen = !isChatOpen;
            if (isChatOpen) {
                chatOverlay.style.display = 'flex';
                badge.style.display = 'none';
                scrollToBottom();
            } else {
                chatOverlay.style.display = 'none';
            }
        }

        function initChat() {
            chatRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const div = document.createElement('div');
                div.classList.add('msg');
                div.classList.add(msg.sender === currentUser ? 'my-msg' : 'other-msg');
                
                const nameSpan = document.createElement('div');
                nameSpan.classList.add('msg-name');
                nameSpan.innerText = msg.sender;
                
                const textSpan = document.createElement('span');
                textSpan.innerText = msg.text;

                div.appendChild(nameSpan);
                div.appendChild(textSpan);
                messagesDiv.appendChild(div);
                
                if (isChatOpen) {
                    scrollToBottom();
                } else if (msg.sender !== currentUser) {
                    badge.style.display = 'block';
                }
            });
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === "") return;

            chatRef.push({
                sender: currentUser,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            chatInput.value = "";
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ==========================================
        // ИСПРАВЛЕННЫЙ DRAG & DROP ДЛЯ ЧАТА
        // ==========================================
        const floatBtn = document.getElementById('chat-float-btn');
        let isDragging = false;
        let isMoved = false;
        let startX, startY, initialLeft, initialTop;

        const dragStart = (e) => {
            // Игнорируем клик, если он был по крестику (чтобы не баговало закрытие)
            if (e.target.closest('#chat-close')) return;

            isDragging = true;
            isMoved = false; 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            startX = clientX;
            startY = clientY;
            
            // Фиксируем текущие координаты, чтобы кнопка не прыгала
            const rect = floatBtn.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            floatBtn.style.left = initialLeft + 'px';
            floatBtn.style.top = initialTop + 'px';
            floatBtn.style.right = 'auto';
            floatBtn.style.bottom = 'auto';
        };

        const dragMove = (e) => {
            if (!isDragging) return;
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const diffX = clientX - startX;
            const diffY = clientY - startY;

            // Чувствительность в 5 пикселей, чтобы отличить клик от случайного смахивания
            if (Math.abs(diffX) > 5 || Math.abs(diffY) > 5) {
                isMoved = true;
            }

            if (isMoved) {
                e.preventDefault(); // Запрещаем скролл экрана при перетаскивании
                
                let newLeft = initialLeft + diffX;
                let newTop = initialTop + diffY;
                
                // Ограничиваем рамками экрана
                newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - floatBtn.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, window.innerHeight - floatBtn.offsetHeight));

                floatBtn.style.left = newLeft + 'px';
                floatBtn.style.top = newTop + 'px';
            }
        };

        const dragEnd = (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            // Если кнопку не тащили, а просто кликнули - открываем чат
            if (!isMoved) {
                toggleChat();
            }
        };

        // Обработчики мыши
        floatBtn.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove, { passive: false });
        document.addEventListener('mouseup', dragEnd);

        // Обработчики сенсорного экрана (iPhone/Android)
        floatBtn.addEventListener('touchstart', dragStart, { passive: false });
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);

    </script>
</body>
</html>
