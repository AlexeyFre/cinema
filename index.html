<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#09090f">
<title>Наш Кинотеатр ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Mono:wght@300;400&display=swap');

/* ── TOKENS ─────────────────────────────────────────── */
:root {
  --bg: #09090f;
  --s1: #0f0f1b;
  --s2: #161624;
  --s3: #1e1e2e;
  --border: rgba(255,255,255,.07);
  --border2: rgba(255,255,255,.13);
  --accent: #c9956e;
  --accent2: #e8c09a;
  --text: #ece8e0;
  --dim: #7a7568;
  --muted: #3a3830;
  --red: #c96e6e;
  --green: #6ec9a0;
  --chat-w: 300px;
  --topbar-h: 42px;
  --vttbar-h: 32px;
}

/* ── RESET ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; height: 100dvh; overflow: hidden; }
body {
  height: 100%; height: 100dvh; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 13px;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  user-select: none; -webkit-user-select: none;
}

/* ── LOCK SCREEN ────────────────────────────────────── */
#lock {
  position: fixed; inset: 0; z-index: 9999; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.lock-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 50% at 50% 40%, rgba(201,149,110,.1) 0%, transparent 70%);
}
.lock-box {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center;
  gap: 24px; width: 100%; max-width: 310px;
}
.lock-icon { font-size: 42px; animation: hb 2.5s ease-in-out infinite; }
@keyframes hb { 0%,100%{transform:scale(1);opacity:.65} 50%{transform:scale(1.18);opacity:1} }
.lock-title {
  font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 300; font-style: italic;
  color: var(--accent); text-align: center; line-height: 1.1;
}
.lock-sub { font-size: 10px; color: var(--dim); letter-spacing: .18em; text-transform: uppercase; }
.lock-fields { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.field-lbl { font-size: 9px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 5px; }
.field-input {
  width: 100%; background: var(--s2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 15px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 14px;
  outline: none; -webkit-appearance: none; appearance: none;
  transition: border-color .2s, box-shadow .2s;
  user-select: text; -webkit-user-select: text;
}
.field-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(201,149,110,.12); }
.field-input::placeholder { color: var(--muted); }
.room-row { display: flex; gap: 8px; align-items: center; }
.room-row .field-input { flex: 1; }
.dice-btn {
  background: var(--s3); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 13px;
  font-size: 17px; cursor: pointer; flex-shrink: 0; transition: border-color .2s; -webkit-appearance: none;
}
.dice-btn:hover { border-color: var(--accent); }
.lock-enter {
  width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: 10px; padding: 14px; color: var(--bg); font-family: 'DM Mono', monospace;
  font-size: 12px; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; -webkit-appearance: none;
  transition: opacity .2s, transform .1s;
}
.lock-enter:active { transform: scale(.97); opacity: .88; }
.lock-err { font-size: 11px; color: var(--red); text-align: center; min-height: 16px; }

/* ── APP SHELL ──────────────────────────────────────── */
#app { display: none; width: 100%; height: 100%; height: 100dvh; }
#app.on { display: flex; }

/* DESKTOP */
@media (min-width: 768px) {
  #app { flex-direction: row; }
  #vcol { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  #ccol {
    width: var(--chat-w); flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--s1); border-left: 1px solid var(--border); overflow: hidden;
  }
  #app.chat-only #vcol { display: none; }
  #app.chat-only #ccol { width: 100%; border-left: none; }
}

/* MOBILE PORTRAIT */
@media (max-width: 767px) {
  #app { flex-direction: column; }
  #vcol {
    flex: 0 0 auto; max-height: 42dvh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #ccol {
    flex: 1; display: flex; flex-direction: column; background: var(--s1);
    border-top: 1px solid var(--border); overflow: hidden;
  }
  #app.chat-only #vcol { display: none; }
  #app.chat-only #ccol { flex: 1; border-top: none; }
}

/* MOBILE LANDSCAPE */
@media (max-width: 767px) and (orientation: landscape) {
  #app { flex-direction: row; }
  #vcol { flex: 0 0 52%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  #ccol { flex: 1; height: 100%; border-top: none; border-left: 1px solid var(--border); }
  #app.chat-only #vcol { display: none; }
  #app.chat-only #ccol { flex: 1; border-left: none; }
  
  #status-bar, #quick-phrases { display: none !important; }
  #react-bar { padding: 4px 5px; }
  #chat-hdr { display: none; }
}

/* Хак для клавиатуры на мобилках */
body.typing-mode #quick-phrases { display: none !important; }
body.typing-mode #react-bar { display: none !important; }
body.typing-mode #vcol { max-height: 25dvh !important; }

/* ── TOP BAR (Video controls) ───────────────────────── */
#topbar {
  height: var(--topbar-h); display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: var(--s1); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow: hidden;
}
#url-inp {
  flex: 1; min-width: 0; background: var(--s2); border: 1px solid var(--border);
  border-radius: 7px; padding: 6px 10px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 11px;
  outline: none; -webkit-appearance: none; appearance: none; user-select: text; -webkit-user-select: text;
}
#url-inp:focus { border-color: var(--accent); }
#load-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 7px; padding: 6px 11px;
  color: var(--bg); font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
}
#clear-btn { background: none; border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; color: var(--dim); cursor: pointer; }
#force-sync-btn { background: none; border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; color: var(--dim); cursor: pointer; }

/* ── VTT BAR ────────────────────────────────────────── */
#vttbar {
  height: var(--vttbar-h); display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: var(--s1); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#vtt-inp { flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-size: 11px; outline: none; user-select: text;}
#vtt-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; color: var(--dim); cursor: pointer; font-size: 10px;}

/* ── PLAYER ─────────────────────────────────────────── */
#player-wrap { flex: 1; position: relative; background: #000; overflow: hidden; min-height: 0; cursor: pointer; }
#ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
#vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
#yt-wrap { position: absolute; inset: 0; display: none; }
#yt-wrap.on { display: block; }
#yt-inner { width: 100%; height: 100%; }
#yt-shield { position: absolute; inset: 0; z-index: 2; cursor: pointer; }

/* ── CONTROLS OVERLAY ───────────────────────────────── */
#ctrl-overlay {
  position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end;
  background: linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.35) 35%, transparent 65%);
  transition: opacity .3s; pointer-events: none;
}
#ctrl-overlay.hidden { opacity: 0; }
#ctrl-overlay.hidden * { pointer-events: none !important; }
#ctrl-overlay:not(.hidden) #ctrl-bar { pointer-events: all; }
#ctrl-overlay:not(.hidden) #centre-btn { pointer-events: all; }

#centre-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 15;
  width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.52); border: 2px solid rgba(255,255,255,.25);
  backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: none;
}
#ctrl-bar { padding: 28px 14px 12px; }
#prog-wrap { width: 100%; height: 22px; display: flex; align-items: center; position: relative; cursor: pointer; margin-bottom: 8px; }
#prog-track { width: 100%; height: 3px; background: rgba(255,255,255,.18); border-radius: 3px; position: relative; }
#prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); pointer-events: none; }
#prog-thumb { position: absolute; top: 50%; left: 0%; width: 13px; height: 13px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); pointer-events: none; }
#ctrl-row { display: flex; align-items: center; gap: 2px; }
.cb { background: none; border: none; color: rgba(255,255,255,.88); font-size: 23px; cursor: pointer; padding: 5px 9px; }
#time-lbl { font-size: 11px; color: rgba(255,255,255,.55); min-width: 94px; text-align: center; }
.sp { flex: 1; }
#vol-wrap { display: flex; align-items: center; gap: 4px; margin-right: 18px; }
#vol-range { width: 62px; cursor: pointer; }

/* ── CHAT ───────────────────────────────────────────── */
#chat-hdr { padding: 13px 13px 9px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ch-title { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-style: italic; color: var(--accent); margin-bottom: 3px; }

#status-bar { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 5px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; align-items: center; }
.sb-item { font-size: 10px; color: var(--dim); }
.sb-item b { color: var(--accent); }

#react-bar { display: flex; gap: 5px; padding: 7px 10px 0; flex-shrink: 0; }
.rb { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 15px; cursor: pointer; }

#msgs { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px; display: flex; flex-direction: column; gap: 7px; min-height: 0; scroll-behavior: smooth; }
.msg { max-width: 85%; display: flex; flex-direction: column; gap: 2px; position: relative; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.them { align-self: flex-start; align-items: flex-start; }
.msg.sys { align-self: center; max-width: 100%; align-items: center; }

.msg-hdr { display: flex; align-items: center; gap: 5px; padding: 0 3px; }
.msg-name { font-size: 9px; color: var(--dim); letter-spacing: .05em; }
.reply-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 10px; padding: 2px; }
.reply-btn:hover { color: var(--accent); }

.msg-bbl { padding: 8px 11px; border-radius: 13px; font-size: 13px; line-height: 1.5; word-break: break-word; user-select: text; position: relative; }
.msg.me .msg-bbl { background: rgba(201,149,110,.22); border: 1px solid rgba(201,149,110,.22); border-bottom-right-radius: 4px; }
.msg.them .msg-bbl { background: var(--s2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg-time { font-size: 9px; color: var(--muted); padding: 0 3px; }

/* ── REPLIES ── */
.msg-reply-block {
  background: rgba(0,0,0,0.25); border-left: 2px solid var(--accent);
  padding: 4px 8px; margin-bottom: 4px; border-radius: 4px; font-size: 11px; cursor: pointer;
}
.msg.me .msg-reply-block { background: rgba(0,0,0,0.15); }
.msg-reply-name { font-weight: bold; color: var(--accent); margin-bottom: 2px; }
.msg-reply-text { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

#reply-preview {
  display: none; background: var(--s2); border-left: 3px solid var(--accent);
  padding: 8px 12px; font-size: 11px; color: var(--dim); flex-shrink: 0;
  justify-content: space-between; align-items: center;
}
#reply-preview.active { display: flex; }
#reply-preview-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#reply-cancel { cursor: pointer; font-size: 14px; padding: 0 5px; color: var(--muted); }

/* ── HEARTS (DOUBLE TAP REACTIONS) ── */
.msg-heart {
  position: absolute; 
  bottom: -6px; /* Залезает на пузырь, а не висит под ним */
  background: var(--s1); 
  border: 1px solid var(--border);
  border-radius: 20px; 
  padding: 1px 5px; 
  font-size: 11px; 
  display: flex; 
  align-items: center; 
  gap: 2px;
  box-shadow: 0 1px 4px rgba(0,0,0,.4); 
  z-index: 2;
}
.msg.me .msg-heart { right: 6px; left: auto; }
.msg.them .msg-heart { left: 6px; right: auto; }

.msg-heart.pop { animation: heartPop .3s ease-out; }
@keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.45); } 100% { transform: scale(1); } }

/* Вспышка пузыря при двойном тапе */
.tap-flash { animation: bblFlash .25s ease; }
@keyframes bblFlash { 0% { opacity: 1; filter: brightness(1); } 50% { opacity: .6; filter: brightness(1.5); } 100%{ opacity: 1; filter: brightness(1); } }

/* Всплывающие смайлики от реакций сверху */
.floater { position: fixed; font-size: 26px; pointer-events: none; z-index: 9000; animation: floatUp 1.5s ease-out forwards; }
@keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120px) scale(1.5); opacity: 0; } }

/* ── MISC ── */
#typing-indicator { padding: 0 12px 5px; font-size: 10px; color: var(--accent); min-height: 18px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
#quick-phrases { display: flex; gap: 5px; flex-wrap: wrap; padding: 6px 10px 2px; flex-shrink: 0; }
.qp-btn { background: var(--s3); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 11px; color: var(--dim); cursor: pointer; }

#chat-inp-wrap { display: flex; align-items: flex-end; gap: 7px; padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); background: var(--s1); flex-shrink: 0; }
#chat-ta { flex: 1; background: var(--s2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; color: var(--text); font-family: inherit; font-size: 13px; line-height: 1.45; resize: none; outline: none; max-height: 90px; }
#send-btn { width: 38px; height: 38px; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 10px; color: var(--bg); cursor: pointer; }

#toast { position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--s2); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 16px; font-size: 12px; color: var(--dim); opacity: 0; z-index: 9999; pointer-events: none; transition: .25s; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="lock-glow"></div>
  <div class="lock-box">
    <div class="lock-title">Наш Кинотеатр</div>
    <div class="lock-sub">только для двоих</div>
    <div class="lock-fields">
      <div>
        <div class="field-lbl">Твоё имя</div>
        <input class="field-input" id="li-name" type="text" placeholder="Как тебя зовут?" maxlength="20">
      </div>
      <div>
        <div class="field-lbl">Код комнаты</div>
        <div class="room-row">
          <input class="field-input" id="li-room" type="text" placeholder="Придумай" maxlength="20">
          <button class="dice-btn" id="dice-btn">🎲</button>
        </div>
      </div>
      <div>
        <div class="field-lbl">Пароль</div>
        <input class="field-input" id="li-pass" type="password" placeholder="••••••">
      </div>
    </div>
    <button class="lock-enter" id="enter-btn">Войти в кино →</button>
    <div class="room-row">
      <input type="checkbox" id="chat-only-cb"> <label for="chat-only-cb" style="font-size:11px;color:var(--dim)">Только чат</label>
    </div>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- VIDEO COLUMN -->
  <div id="vcol">
    <div id="topbar">
      <div class="brand">Cinéma ❤️</div>
      <input id="url-inp" type="url" placeholder="Ссылка на YouTube или mp4…">
      <button id="clear-btn" title="Сбросить видео" style="display:none">✕</button>
      <button id="load-btn">▶ Загрузить</button>
      <button id="force-sync-btn">⟳</button>
    </div>
    <div id="vttbar">
      <input id="vtt-inp" type="url" placeholder="Ссылка на .vtt (субтитры)…">
      <button id="vtt-btn">ОК</button>
    </div>
    <div id="player-wrap">
      <div id="ph">
        <div class="ph-title">Кинотеатр</div>
        <div class="lock-sub">Вставьте ссылку выше</div>
      </div>
      <video id="vid" playsinline webkit-playsinline preload="metadata"></video>
      <div id="yt-wrap"><div id="yt-inner"></div><div id="yt-shield"></div></div>
      
      <div id="ctrl-overlay">
        <button id="centre-btn">
          <svg id="centre-icon" width="26" height="26" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21" /></svg>
        </button>
        <div id="ctrl-bar">
          <div id="prog-wrap">
            <div id="prog-track"><div id="prog-fill"></div><div id="prog-thumb"></div></div>
          </div>
          <div id="ctrl-row">
            <button class="cb" id="play-btn">▶</button>
            <button class="cb sm" id="back-btn">⏪</button>
            <button class="cb sm" id="fwd-btn">⏩</button>
            <span id="time-lbl">0:00 / 0:00</span>
            <div class="sp"></div>
            <div id="vol-wrap">
              <button class="cb sm" id="mute-btn">🔊</button>
              <input type="range" id="vol-range" min="0" max="1" step="0.02" value="1">
            </div>
            <button class="cb sm" id="fs-btn">⛶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT COLUMN -->
  <div id="ccol">
    <div id="chat-hdr">
      <div class="ch-title">Чат</div>
    </div>
    <div id="status-bar"></div>
    <div id="react-bar">
      <button class="rb" data-e="❤️">❤️</button>
      <button class="rb" data-e="😂">😂</button>
      <button class="rb" data-e="😱">😱</button>
      <button class="rb" data-e="👏">👏</button>
      <button class="rb" data-e="🍿">🍿</button>
    </div>
    <div id="msgs"></div>
    
    <div id="typing-indicator"></div>
    <div id="quick-phrases">
      <button class="qp-btn" data-phrase="Минуту ⏸️">Минуту ⏸️</button>
      <button class="qp-btn" data-phrase="Я в туалет 🚽">Я в туалет 🚽</button>
    </div>
    
    <div id="reply-preview">
      <div id="reply-preview-text"></div>
      <div id="reply-cancel" onclick="cancelReply()">✕</div>
    </div>
    <div id="chat-inp-wrap">
      <textarea id="chat-ta" rows="1" placeholder="Сообщение…"></textarea>
      <button id="send-btn">➤</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<!-- SCRIPTS -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, get, remove, onValue, push, serverTimestamp, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const FB_CONFIG = {
  apiKey: "AIzaSyBatXdgIXXW5c4VFibd24bhoAockReJPrE",
  authDomain: "our-cinema-20c0f.firebaseapp.com",
  databaseURL: "https://our-cinema-20c0f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "our-cinema-20c0f",
  storageBucket: "our-cinema-20c0f.firebasestorage.app",
  messagingSenderId: "970156344935",
  appId: "1:970156344935:web:74ecce58fb40f4579636c2"
};

const PASSWORD = 'love123';
const fbApp = initializeApp(FB_CONFIG);
const db = getDatabase(fbApp);

/* ── HELPERS ── */
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let toastTimer;
function toast(msg, ms = 2500) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}

/* ── STATE ── */
let myName = '', roomId = '';
let db_sync, db_chat, db_pres_me, db_reactions, db_typing_me, db_typing_room;
let isYT = false, ytPlayer = null;
let chatOnlyMode = false;
let lastPushedUrl = '';
let ctrlHideTimer, ctrlVisible = true, progDragging = false;
let knownMsgKeys = new Set();
let replyingTo = null; // Object for reply feature
const _heartThrottle = {}; // Защита от спама двойными кликами

// SYNC STATE
let lastAppliedSyncTs = 0; 
let isApplyingRemote = false;

/* ── ENTRY ── */
$('dice-btn').onclick = () => { $('li-room').value = 'room-' + Math.floor(Math.random()*1000); };
$('enter-btn').onclick = tryEnter;
['li-name','li-room','li-pass'].forEach(id => $(id).addEventListener('keydown', e => { if(e.key==='Enter') tryEnter(); }));

function tryEnter() {
  const name = $('li-name').value.trim();
  const room = $('li-room').value.trim().toLowerCase().replace(/\s+/g,'-');
  if (!name || !room || $('li-pass').value !== PASSWORD) { $('lock-err').textContent = 'Ошибка ввода'; return; }
  
  myName = name; roomId = room; chatOnlyMode = $('chat-only-cb').checked;
  $('lock').style.display = 'none'; $('app').classList.add('on');
  if (chatOnlyMode) $('app').classList.add('chat-only');
  
  initFirebaseRefs();
  initChat();
  initPresence();
  initKeyboardLogic(); 
  
  if (!chatOnlyMode) {
    initPlayer();
    initSync();
  }
}

function initFirebaseRefs() {
  const base = 'rooms/' + roomId;
  const safeKey = myName.replace(/[.#$\/\[\]]/g,'_');
  db_sync = ref(db, base + '/sync');
  db_chat = ref(db, base + '/chat');
  db_pres_me = ref(db, base + '/pres/' + safeKey);
  db_typing_me = ref(db, base + '/typing/' + safeKey);
  db_typing_room = ref(db, base + '/typing');
  db_reactions = ref(db, base + '/reactions'); // Ссылка для лайков
  onDisconnect(db_typing_me).remove();
  onDisconnect(db_pres_me).remove();
}

/* ── KEYBOARD FOCUS FIX (MOBILE) ── */
function initKeyboardLogic() {
  const ta = $('chat-ta');
  ta.addEventListener('focus', () => { document.body.classList.add('typing-mode'); setTimeout(() => scrollToBottom(), 100); });
  ta.addEventListener('blur', () => { setTimeout(() => document.body.classList.remove('typing-mode'), 200); });
}

/* ── MEDIA ── */
$('load-btn').onclick = () => loadUrl($('url-inp').value.trim(), true);
$('clear-btn').onclick = () => {
  clearVideoLocally();
  if(!chatOnlyMode) set(db_sync, { url: '', isYT: false, playing: false, time: 0, by: myName, ts: Date.now() });
};
$('force-sync-btn').onclick = () => {
  if (!lastPushedUrl) return;
  pushSync(); toast('Синхронизирую ⟳');
};

function clearVideoLocally() {
  $('url-inp').value = ''; lastPushedUrl = '';
  $('clear-btn').style.display = 'none';
  const v = $('vid'); v.pause(); v.removeAttribute('src'); v.load(); v.style.display='none';
  if(ytPlayer) { try{ytPlayer.destroy()}catch(e){} ytPlayer=null; }
  $('yt-wrap').classList.remove('on'); $('ph').style.display = 'flex';
}

function loadUrl(url, broadcast) {
  if (!url) return;
  lastPushedUrl = url;
  $('clear-btn').style.display = 'block';
  
  const ytId = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([A-Za-z0-9_-]{11})/);
  if (ytId) loadYT(ytId[1]); else loadMP4(url);
  
  if (broadcast) {
    const payload = { url, isYT: !!ytId, playing: false, time: 0, by: myName, ts: Date.now() };
    set(db_sync, payload);
  }
}

function loadMP4(src) {
  isYT = false; $('yt-wrap').classList.remove('on'); $('ph').style.display = 'none';
  const v = $('vid'); v.src = src; v.style.display = 'block'; v.load();
}

function loadYT(id) {
  isYT = true; $('vid').style.display = 'none'; $('ph').style.display = 'none'; $('yt-wrap').classList.add('on');
  if (window.YT && window.YT.Player) { buildYT(id); return; }
  window.__ytCb = () => buildYT(id);
  if (!document.querySelector('script[src*="youtube"]')) {
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  }
}
window.onYouTubeIframeAPIReady = () => { if(window.__ytCb){window.__ytCb(); window.__ytCb=null;} };

function buildYT(id) {
  $('yt-inner').innerHTML = '<div id="yt-player"></div>';
  ytPlayer = new YT.Player('yt-player', {
    videoId: id, width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, controls: 1 },
    events: {
      onReady: () => toast('YouTube готов ✓'),
      onStateChange: (e) => {
        if(isApplyingRemote) return; 
        if(e.data === YT.PlayerState.PLAYING) pushSync();
        if(e.data === YT.PlayerState.PAUSED) pushSync();
      }
    }
  });
}

/* ── SYNC (STABLE) ── */
function isPlaying() { return isYT ? (ytPlayer && ytPlayer.getPlayerState()===1) : (!$('vid').paused && !$('vid').ended); }
function getCur() { return isYT ? (ytPlayer ? ytPlayer.getCurrentTime():0) : ($('vid').currentTime||0); }
function togglePlay() {
  if (isYT) { if(ytPlayer) ytPlayer.getPlayerState()===1 ? ytPlayer.pauseVideo() : ytPlayer.playVideo(); }
  else { const v = $('vid'); v.paused ? v.play() : v.pause(); }
}

function pushSync() {
  if (chatOnlyMode) return;
  const payload = {
    url: lastPushedUrl || $('url-inp').value,
    isYT, playing: isPlaying(), time: getCur(),
    by: myName, ts: Date.now()
  };
  set(db_sync, payload);
}

function initSync() {
  onValue(db_sync, snap => {
    const d = snap.val();
    if (!d || chatOnlyMode) return;
    if (d.by === myName) return;
    if (d.ts <= lastAppliedSyncTs) return;
    lastAppliedSyncTs = d.ts;

    if (d.url && d.url !== lastPushedUrl) {
      $('url-inp').value = d.url;
      loadUrl(d.url, false);
      setTimeout(() => applyRemoteState(d), 1500);
      return;
    }
    applyRemoteState(d);
  });
}

function applyRemoteState(d) {
  isApplyingRemote = true; 
  const drift = Math.abs(getCur() - d.time);
  
  if (d.playing !== isPlaying()) {
    if (d.playing) {
      if (isYT) { ytPlayer && ytPlayer.playVideo(); } else { $('vid').play().catch(()=>{}); }
    } else {
      if (isYT) { ytPlayer && ytPlayer.pauseVideo(); } else { $('vid').pause(); }
    }
  }

  if (drift > 1.5) {
    if (isYT) { ytPlayer && ytPlayer.seekTo(d.time, true); }
    else { $('vid').currentTime = d.time; }
  }
  setTimeout(() => { isApplyingRemote = false; }, 1000);
}

function initPlayer() {
  const v = $('vid');
  v.addEventListener('play', () => { if(!isApplyingRemote) pushSync(); $('play-btn').textContent = '⏸'; });
  v.addEventListener('pause', () => { if(!isApplyingRemote) pushSync(); $('play-btn').textContent = '▶'; });
  v.addEventListener('seeked', () => { if(!isApplyingRemote) pushSync(); });
  v.addEventListener('timeupdate', () => {
    const pct = (v.currentTime / v.duration) * 100 || 0;
    $('prog-fill').style.width = pct+'%'; $('prog-thumb').style.left = pct+'%';
  });
  
  $('play-btn').onclick = () => togglePlay();
  $('centre-btn').onclick = () => togglePlay();
  $('yt-shield').onclick = () => { if(window.innerWidth > 768) togglePlay(); };
}

/* ── CHAT, REPLIES, & REACTIONS ── */
window.cancelReply = function() { replyingTo = null; $('reply-preview').classList.remove('active'); }

function setReply(key, name, text) {
  replyingTo = { key, name, text };
  $('reply-preview-text').innerHTML = `<b>${esc(name)}</b>: ${esc(text)}`;
  $('reply-preview').classList.add('active');
  $('chat-ta').focus();
}

window.scrollToMsg = function(key) {
  const msg = document.querySelector(`.msg[data-msg-key="${key}"]`);
  if (msg) {
    msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const bbl = msg.querySelector('.msg-bbl');
    if(bbl) { bbl.classList.remove('tap-flash'); void bbl.offsetWidth; bbl.classList.add('tap-flash'); }
  }
}

function initChat() {
  const ta = $('chat-ta');
  $('send-btn').onclick = sendMsg;
  ta.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
  
  onValue(db_chat, snap => {
    const data = snap.val() || {};
    $('msgs').innerHTML = '';
    Object.entries(data).forEach(([k, m]) => {
      const node = buildMsg(m, k);
      if (node) $('msgs').appendChild(node);
    });
    scrollToBottom();
  });

  // Панель реакций
  document.querySelectorAll('.rb').forEach(btn => {
    btn.onclick = () => {
      const emoji = btn.dataset.e;
      push(db_chat, { type: 'reaction', emoji, name: myName, ts: serverTimestamp() }).catch(e => console.error(e));
      spawnFloat(emoji, btn);
    };
  });

  // Быстрые фразы
  document.querySelectorAll('.qp-btn').forEach(b => b.onclick = () => {
    push(db_chat, { type:'msg', text: b.dataset.phrase, name: myName, ts: serverTimestamp() });
  });

  // Слушатель Firebase для лайков на сообщениях
  initReactions();
}

function scrollToBottom() { const m = $('msgs'); m.scrollTop = m.scrollHeight; }

function sendMsg() {
  const text = $('chat-ta').value.trim();
  if (!text) return;
  const payload = { type:'msg', text, name: myName, ts: serverTimestamp() };
  if (replyingTo) { payload.replyTo = replyingTo; }
  
  push(db_chat, payload);
  $('chat-ta').value = ''; cancelReply();
}

function buildMsg(m, key) {
  if (!m || !m.type) return null;
  const div = document.createElement('div');

  if (m.type === 'reaction') {
    div.className = 'msg sys';
    div.innerHTML = `<div class="msg-bbl"><b>${esc(m.name)}</b> отправил(а) ${m.emoji}</div>`;
    return div;
  }

  const isMe = m.name === myName;
  div.className = 'msg ' + (isMe ? 'me' : 'them');
  div.dataset.msgKey = key;
  
  let replyHtml = '';
  if (m.replyTo) {
    replyHtml = `<div class="msg-reply-block" onclick="scrollToMsg('${m.replyTo.key}')">
                   <div class="msg-reply-name">${esc(m.replyTo.name)}</div>
                   <div class="msg-reply-text">${esc(m.replyTo.text)}</div>
                 </div>`;
  }

  div.innerHTML = `
    <div class="msg-hdr">
      ${!isMe ? `<span class="msg-name">${esc(m.name)}</span>` : ''}
      <button class="reply-btn" onclick="setReply('${key}','${esc(m.name)}','${esc(m.text)}')">↩️</button>
      ${isMe ? `<span class="msg-name">${esc(m.name)}</span>` : ''}
    </div>
    <div class="msg-bbl">${replyHtml}${esc(m.text)}</div>
  `;
  
  // Добавляем прослушку двойного клика для сердечек
  if (key) attachDoubleTap(div, key);

  return div;
}

/* ── DOUBLE TAP REACTIONS (HEARTS) ── */
function attachDoubleTap(div, key) {
  let lastTapTime = 0;
  let touchHandled = false;

  div.addEventListener('touchend', e => {
    if (e.target.closest('.reply-btn') || e.target.closest('.msg-reply-block')) return;
    
    touchHandled = true;
    clearTimeout(div._thReset);
    div._thReset = setTimeout(() => { touchHandled = false; }, 600);

    const now = Date.now();
    if (now - lastTapTime < 380) {
      lastTapTime = 0;
      toggleHeart(key, div);
    } else {
      lastTapTime = now;
    }
  }, { passive: true });

  div.addEventListener('dblclick', (e) => {
    if (e.target.closest('.reply-btn') || e.target.closest('.msg-reply-block')) return;
    if (touchHandled) return;
    toggleHeart(key, div);
  });
}

function toggleHeart(key, div) {
  const now = Date.now();
  if (_heartThrottle[key] && now - _heartThrottle[key] < 600) return;
  _heartThrottle[key] = now;

  const safeKey = myName.replace(/[.#$\/\[\]]/g,'_');
  const heartRef = ref(db, 'rooms/' + roomId + '/reactions/' + key + '/hearts/' + safeKey);

  const bbl = div.querySelector('.msg-bbl');
  if (bbl) {
    bbl.classList.remove('tap-flash'); void bbl.offsetWidth; bbl.classList.add('tap-flash');
  }

  get(heartRef).then(snap => {
    if (snap.exists()) remove(heartRef); else set(heartRef, true);
  });
}

function initReactions() {
  onValue(db_reactions, snap => {
    const data = snap.val() || {};
    document.querySelectorAll('.msg[data-msg-key]').forEach(div => {
      const key = div.dataset.msgKey;
      const hearts = data[key] ? Object.keys(data[key].hearts || {}) : [];
      updateHeartBadge(div, hearts);
    });
  });
}

function updateHeartBadge(div, hearts) {
  let badge = div.querySelector('.msg-heart');
  if (hearts.length === 0) {
    if (badge) badge.remove();
    return;
  }

  const bbl = div.querySelector('.msg-bbl');
  if (!bbl) return;

  if (!badge) {
    badge = document.createElement('div');
    badge.className = 'msg-heart';
    bbl.appendChild(badge);
  }

  const prev = badge.dataset.count;
  badge.dataset.count = hearts.length;

  badge.innerHTML = '❤️' + (hearts.length > 1 ? ` <span style="margin-left:2px">${hearts.length}</span>` : '');

  if (prev !== String(hearts.length)) {
    badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');
  }
}

function spawnFloat(emoji, anchor) {
  const r = anchor.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'floater';
  f.textContent = emoji;
  f.style.left = (r.left + r.width/2 - 13) + 'px';
  f.style.top = (r.top - 10) + 'px';
  document.body.appendChild(f);
  f.addEventListener('animationend', () => f.remove());
}

/* ── PRESENCE ── */
function initPresence() {
  const presRoomRef = ref(db, 'rooms/' + roomId + '/pres');
  onValue(presRoomRef, snap => {
    const data = snap.val() || {};
    const others = Object.values(data).filter(u => u && u.name && u.name !== myName);
    $('status-bar').innerHTML = others.map(u => `<span class="sb-item"><b>${esc(u.name)}</b> здесь</span>`).join('');
  });
  setInterval(() => set(db_pres_me, { name: myName, online: true }), 5000);
}

</script>
