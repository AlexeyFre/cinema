<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Использование dvh и запрет масштабирования спасают макет при открытии клавиатуры на iOS/Android -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Кино для двоих 🍿</title>

    <!-- Подключение Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        /* ==========================================
           ГЛОБАЛЬНЫЙ СБРОС И БАЗОВЫЕ СТИЛИ
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #000000;
            --bg-card: #1a1a1a;
            --bg-input: #2a2a2a;
            --primary: #E50914;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
        }

        html, body {
            width: 100vw;
            height: 100dvh; /* Используем dVH для фикса бага с клавиатурой */
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Запрещаем скролл страницы */
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
        }

        input {
            font-family: inherit;
            outline: none;
        }

        /* ==========================================
           ЭКРАН АВТОРИЗАЦИИ
           ========================================== */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .login-card h1 { margin-bottom: 25px; font-size: 24px; font-weight: 600; }
        .login-card input {
            width: 100%; padding: 14px; margin-bottom: 15px;
            background: var(--bg-deep); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px;
        }
        .login-card input:focus { border-color: var(--primary); }
        .btn-main {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border-radius: 8px; font-size: 16px; font-weight: bold; transition: background 0.2s;
        }
        .btn-main:hover { background: #b20710; }

        /* ==========================================
           ГЛАВНЫЙ МАКЕТ (СЕТКА)
           ========================================== */
        #app-wrapper {
            display: none; /* Скрыто до логина */
            width: 100vw;
            height: 100dvh;
            flex-direction: column; /* По умолчанию мобильный вид (Вертикальный) */
        }

        /* ----------------------------------
           СЕКЦИЯ ВИДЕО
           ---------------------------------- */
        #video-section {
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            flex-shrink: 0;
            width: 100%;
        }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ */
        #controls-panel {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        #video-url-input {
            flex-grow: 1;
            min-width: 100px;
            padding: 10px;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-small {
            background: var(--primary); color: white; padding: 10px 15px;
            border-radius: 6px; font-size: 14px; font-weight: 600; white-space: nowrap;
        }

        .btn-secondary {
            background: var(--bg-input); border: 1px solid var(--border-color);
        }

        /* КОНТЕЙНЕР ПЛЕЕРА */
        #player-container {
            width: 100%;
            background: #000;
            position: relative;
            /* Мобильные пропорции 16:9 */
            aspect-ratio: 16 / 9; 
        }

        #html5-player {
            width: 100%; height: 100%; object-fit: contain; display: block;
        }

        #yt-player {
            width: 100%; height: 100%; display: none; border: none;
        }

        /* ----------------------------------
           СЕКЦИЯ ЧАТА
           ---------------------------------- */
        #chat-section {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0; /* ВАЖНО для правильного скролла во Flexbox */
            background: var(--bg-deep);
            border-top: 1px solid var(--border-color);
        }

        #chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-deep);
        }

        .msg-container {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .msg-container.my-msg { align-self: flex-end; }
        .msg-container.other-msg { align-self: flex-start; }

        .msg-name {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            margin-left: 4px;
            margin-right: 4px;
        }
        .my-msg .msg-name { text-align: right; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .my-msg .msg-bubble { background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .other-msg .msg-bubble { background: var(--bg-card); color: var(--text-main); border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }

        #chat-input-area {
            display: flex;
            padding: 12px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            gap: 10px;
        }

        #chat-input {
            flex-grow: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: white;
            font-size: 15px;
        }

        #chat-send-btn {
            background: var(--primary); color: white; border-radius: 50%;
            width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }

        input[type="file"] { display: none; }

        /* ==========================================
           МЕДИАЗАПРОС ДЛЯ ПК И ПЛАНШЕТОВ (Горизонтальный вид)
           ========================================== */
        @media (min-width: 768px) and (orientation: landscape) {
            #app-wrapper {
                flex-direction: row; /* Видео слева, чат справа */
            }

            #video-section {
                flex-grow: 1;
                width: 70%;
                height: 100dvh;
            }

            #player-container {
                aspect-ratio: auto;
                flex-grow: 1; /* Занимает всю оставшуюся высоту под контролами */
            }

            #chat-section {
                width: 30%;
                min-width: 320px;
                max-width: 450px;
                height: 100dvh;
                border-top: none;
                border-left: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen">
        <div class="login-card">
            <h1>Кино для двоих 🍿</h1>
            <input type="text" id="username" placeholder="Ваше имя (например, Зайка)">
            <input type="password" id="password" placeholder="Пароль">
            <button class="btn-main" onclick="app.login()">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="app-wrapper">
        
        <!-- ЛЕВАЯ ЧАСТЬ (ИЛИ ВЕРХНЯЯ НА МОБИЛЬНЫХ) - ВИДЕО -->
        <div id="video-section">
            <div id="controls-panel">
                <input type="text" id="video-url-input" placeholder="Ссылка на YouTube или .mp4">
                <button class="btn-small" onclick="app.loadVideo()">Загрузить</button>
                <label class="btn-small btn-secondary" style="cursor: pointer;">
                    + Субтитры
                    <input type="file" accept=".vtt" id="subtitles-input" onchange="app.loadSubtitles(event)">
                </label>
            </div>
            
            <div id="player-container">
                <!-- Стандартный HTML5 плеер (у него есть своя нативная кнопка Fullscreen) -->
                <video id="html5-player" playsinline controls></video>
                <!-- Контейнер для YouTube Iframe (у него тоже есть своя нативная кнопка Fullscreen) -->
                <div id="yt-player"></div>
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ (ИЛИ НИЖНЯЯ НА МОБИЛЬНЫХ) - ЧАТ -->
        <div id="chat-section">
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Написать сообщение..." onkeypress="app.handleChatKey(event)">
                <button id="chat-send-btn" onclick="app.sendMessage()">➤</button>
            </div>
        </div>

    </div>

    <script>
        /**
         * ГЛАВНЫЙ ОБЪЕКТ ПРИЛОЖЕНИЯ
         * Инкапсулируем всю логику для чистоты кода и избежания конфликтов.
         */
        const app = {
            // КОНФИГУРАЦИЯ FIREBASE
            firebaseConfig: {
                apiKey: "AIzaSyBatXdgIXXW5c4VFibd24bhoAockReJPrE",
                authDomain: "our-cinema-20c0f.firebaseapp.com",
                databaseURL: "https://our-cinema-20c0f-default-rtdb.europe-west1.firebasedatabase.app/",
                projectId: "our-cinema-20c0f",
                storageBucket: "our-cinema-20c0f.firebasestorage.app",
                messagingSenderId: "970156344935",
                appId: "1:970156344935:web:74ecce58fb40f4579636c2"
            },
            
            // СОСТОЯНИЕ
            password: "love123", // Пароль
            username: "Аноним",
            clientId: Math.random().toString(36).substr(2, 9), // Уникальный ID сессии
            currentMode: 'html5', // 'html5' или 'youtube'
            
            // Флаги синхронизации
            isApplyingRemoteSync: false,
            syncInterval: null,

            // ЭЛЕМЕНТЫ DOM
            ui: {},

            // ИНИЦИАЛИЗАЦИЯ
            init() {
                // Подключаем элементы
                this.ui.loginScreen = document.getElementById('login-screen');
                this.ui.appWrapper = document.getElementById('app-wrapper');
                this.ui.htmlPlayer = document.getElementById('html5-player');
                this.ui.ytPlayerContainer = document.getElementById('yt-player');
                this.ui.urlInput = document.getElementById('video-url-input');
                this.ui.chatMessages = document.getElementById('chat-messages');
                this.ui.chatInput = document.getElementById('chat-input');

                // Инициализация Firebase
                if (!firebase.apps.length) {
                    firebase.initializeApp(this.firebaseConfig);
                }
                this.db = firebase.database();
                this.syncRef = this.db.ref('player_sync');
                this.chatRef = this.db.ref('chat_messages');

                this.setupHtml5Events();
            },

            // 1. АВТОРИЗАЦИЯ
            login() {
                const passVal = document.getElementById('password').value;
                const nameVal = document.getElementById('username').value.trim();

                if (passVal !== this.password) {
                    alert("Неверный пароль!");
                    return;
                }

                if (nameVal) this.username = nameVal;

                // Переключаем интерфейс
                this.ui.loginScreen.style.display = 'none';
                this.ui.appWrapper.style.display = 'flex';

                // Для iOS/Safari: Инициируем плеер по клику пользователя, чтобы разрешить autoplay в будущем
                this.ui.htmlPlayer.load();

                // Запускаем службы
                this.startChatListener();
                this.startSyncListener();
                
                // Запускаем Master Sync Heartbeat (каждую 1 секунду)
                this.startHeartbeat();
            },

            // 2. УПРАВЛЕНИЕ ВИДЕО И ПЛЕЕРАМИ
            loadVideo() {
                const url = this.ui.urlInput.value.trim();
                if (!url) return;

                // Сразу отправляем в Firebase новую ссылку и команду Play с 0 секунды
                this.sendSyncUpdate({
                    url: url,
                    state: 'PLAYING',
                    time: 0
                });
            },

            applyVideoUrl(url) {
                const ytId = this.parseYouTubeId(url);

                if (ytId) {
                    // РЕЖИМ YOUTUBE
                    this.currentMode = 'youtube';
                    this.ui.htmlPlayer.style.display = 'none';
                    this.ui.htmlPlayer.pause();
                    this.ui.ytPlayerContainer.style.display = 'block';

                    if (window.ytPlayerInstance && window.ytPlayerInstance.loadVideoById) {
                        window.ytPlayerInstance.loadVideoById(ytId);
                    } else if (window.isYouTubeApiReady) {
                        window.ytPlayerInstance = new YT.Player('yt-player', {
                            videoId: ytId,
                            playerVars: { 'playsinline': 1, 'controls': 1, 'rel': 0 },
                            events: {
                                'onStateChange': this.onYouTubeStateChange.bind(this)
                            }
                        });
                    } else {
                        // Если API еще грузится, ждем полсекунды
                        setTimeout(() => this.applyVideoUrl(url), 500);
                    }
                } else {
                    // РЕЖИМ HTML5 (.mp4)
                    this.currentMode = 'html5';
                    this.ui.ytPlayerContainer.style.display = 'none';
                    if (window.ytPlayerInstance && window.ytPlayerInstance.pauseVideo) {
                        window.ytPlayerInstance.pauseVideo();
                    }
                    
                    this.ui.htmlPlayer.style.display = 'block';
                    if (this.ui.htmlPlayer.src !== url) {
                        this.ui.htmlPlayer.src = url;
                        this.ui.htmlPlayer.load();
                    }
                }
            },

            parseYouTubeId(url) {
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : null;
            },

            getCurrentTime() {
                if (this.currentMode === 'youtube' && window.ytPlayerInstance && window.ytPlayerInstance.getCurrentTime) {
                    return window.ytPlayerInstance.getCurrentTime();
                }
                return this.ui.htmlPlayer.currentTime || 0;
            },

            // 3. MASTER SYNC (СИНХРОНИЗАЦИЯ ЧЕРЕЗ FIREBASE)
            
            // Локальные события плеера HTML5
            setupHtml5Events() {
                const p = this.ui.htmlPlayer;
                p.addEventListener('play', () => this.handleLocalAction('PLAYING'));
                p.addEventListener('pause', () => this.handleLocalAction('PAUSED'));
                p.addEventListener('seeked', () => this.handleLocalAction(p.paused ? 'PAUSED' : 'PLAYING'));
            },

            // Локальные события плеера YouTube
            onYouTubeStateChange(event) {
                if (event.data === YT.PlayerState.PLAYING) this.handleLocalAction('PLAYING');
                if (event.data === YT.PlayerState.PAUSED) this.handleLocalAction('PAUSED');
            },

            // Обработка действий пользователя
            handleLocalAction(state) {
                if (this.isApplyingRemoteSync) return; // Игнорируем эхо от чужих команд
                
                this.sendSyncUpdate({
                    url: this.ui.htmlPlayer.src || (window.ytPlayerInstance ? window.ytPlayerInstance.getVideoUrl() : ''),
                    state: state,
                    time: this.getCurrentTime()
                });
            },

            // Отправка данных в базу
            sendSyncUpdate(data) {
                this.syncRef.set({
                    url: data.url || this.lastKnownUrl || '',
                    state: data.state,
                    time: data.time !== undefined ? data.time : this.getCurrentTime(),
                    sender: this.clientId,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            },

            // Чтение данных из базы
            startSyncListener() {
                this.syncRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (!data) return;

                    // Сохраняем URL для пульса
                    this.lastKnownUrl = data.url;

                    // Если команду отправили мы сами — игнорируем
                    if (data.sender === this.clientId) return;

                    // Включаем защиту от эха
                    this.isApplyingRemoteSync = true;

                    // 1. Смена видео
                    if (data.url && data.url !== this.currentPlayingUrl) {
                        this.currentPlayingUrl = data.url;
                        this.applyVideoUrl(data.url);
                    }

                    // 2. Вычисление времени с учетом задержки сети
                    let targetTime = data.time;
                    if (data.state === 'PLAYING' && data.timestamp) {
                        const delay = (Date.now() - data.timestamp) / 1000;
                        if (delay > 0 && delay < 5) targetTime += delay; // Компенсация пинга
                    }

                    this.applyRemoteState(data.state, targetTime);

                    // Отключаем защиту через 1 секунду (после того как плееры точно применят статус)
                    setTimeout(() => { this.isApplyingRemoteSync = false; }, 1000);
                });
            },

            applyRemoteState(state, targetTime) {
                const localTime = this.getCurrentTime();
                
                // Синхронизация времени, если разрыв больше 1.5 секунд
                if (Math.abs(localTime - targetTime) > 1.5) {
                    if (this.currentMode === 'youtube' && window.ytPlayerInstance && window.ytPlayerInstance.seekTo) {
                        window.ytPlayerInstance.seekTo(targetTime, true);
                    } else if (this.currentMode === 'html5') {
                        this.ui.htmlPlayer.currentTime = targetTime;
                    }
                }

                // Синхронизация Play/Pause
                if (this.currentMode === 'youtube' && window.ytPlayerInstance && window.ytPlayerInstance.getPlayerState) {
                    const ytState = window.ytPlayerInstance.getPlayerState();
                    if (state === 'PLAYING' && ytState !== YT.PlayerState.PLAYING) window.ytPlayerInstance.playVideo();
                    if (state === 'PAUSED' && ytState === YT.PlayerState.PLAYING) window.ytPlayerInstance.pauseVideo();
                } else if (this.currentMode === 'html5') {
                    if (state === 'PLAYING' && this.ui.htmlPlayer.paused) {
                        this.ui.htmlPlayer.play().catch(e => console.warn("Auto-play blocked", e));
                    }
                    if (state === 'PAUSED' && !this.ui.htmlPlayer.paused) {
                        this.ui.htmlPlayer.pause();
                    }
                }
            },

            // Сердцебиение: Отправляем пульс каждую секунду ТОЛЬКО если мы играем видео
            startHeartbeat() {
                setInterval(() => {
                    if (this.isApplyingRemoteSync) return; // Не отправляем, если сейчас принимаем данные

                    let isPlayingLocal = false;
                    if (this.currentMode === 'html5') {
                        isPlayingLocal = !this.ui.htmlPlayer.paused;
                    } else if (this.currentMode === 'youtube' && window.ytPlayerInstance && window.ytPlayerInstance.getPlayerState) {
                        isPlayingLocal = (window.ytPlayerInstance.getPlayerState() === YT.PlayerState.PLAYING);
                    }

                    // Транслируем свое время, чтобы напарник не отставал
                    if (isPlayingLocal && this.lastKnownUrl) {
                        this.sendSyncUpdate({
                            url: this.lastKnownUrl,
                            state: 'PLAYING',
                            time: this.getCurrentTime()
                        });
                    }
                }, 2000); // Каждые 2 секунды достаточно для точной синхронизации
            },

            // 4. СУБТИТРЫ
            loadSubtitles(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (this.currentMode === 'youtube') {
                    alert("Кастомные субтитры работают только для файлов .mp4");
                    return;
                }

                let track = document.getElementById('custom-subs');
                if (!track) {
                    track = document.createElement('track');
                    track.id = 'custom-subs';
                    track.kind = 'subtitles';
                    track.label = 'Русский';
                    track.srclang = 'ru';
                    this.ui.htmlPlayer.appendChild(track);
                }

                track.src = URL.createObjectURL(file);
                track.default = true;

                setTimeout(() => {
                    if (this.ui.htmlPlayer.textTracks && this.ui.htmlPlayer.textTracks[0]) {
                        this.ui.htmlPlayer.textTracks[0].mode = 'showing';
                    }
                }, 500);
            },

            // 5. ЧАТ ЛОГИКА
            startChatListener() {
                this.chatRef.on('child_added', (snapshot) => {
                    const msg = snapshot.val();
                    this.renderMessage(msg.sender, msg.text);
                });
            },

            sendMessage() {
                const text = this.ui.chatInput.value.trim();
                if (!text) return;

                this.chatRef.push({
                    sender: this.username,
                    text: text,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                this.ui.chatInput.value = "";
                // Возвращаем фокус, чтобы можно было писать дальше
                this.ui.chatInput.focus(); 
            },

            handleChatKey(e) {
                if (e.key === 'Enter') {
                    this.sendMessage();
                }
            },

            renderMessage(sender, text) {
                const isMe = (sender === this.username);
                
                const wrapper = document.createElement('div');
                wrapper.className = `msg-container ${isMe ? 'my-msg' : 'other-msg'}`;
                
                const name = document.createElement('div');
                name.className = 'msg-name';
                name.innerText = sender;

                const bubble = document.createElement('div');
                bubble.className = 'msg-bubble';
                bubble.innerText = text;

                wrapper.appendChild(name);
                wrapper.appendChild(bubble);

                this.ui.chatMessages.appendChild(wrapper);
                
                // Прокрутка вниз
                this.ui.chatMessages.scrollTop = this.ui.chatMessages.scrollHeight;
            }
        };

        // Глобальная функция-callback для YouTube API
        window.isYouTubeApiReady = false;
        function onYouTubeIframeAPIReady() {
            window.isYouTubeApiReady = true;
        }

        // Запуск
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
