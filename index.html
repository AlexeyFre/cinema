<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кино для двоих 🍿</title>

    <!-- Firebase (используем ваши точные данные) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        /* ==========================================
           БАЗОВЫЕ СТИЛИ
           ========================================== */
        :root {
            --bg-color: #050505;
            --primary-color: #E50914;
            --text-color: #f1f1f1;
            --glass-bg: rgba(20, 20, 20, 0.85);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Запрещаем скролл всей страницы, прокручивается только чат */
        }

        * { box-sizing: border-box; }

        /* ==========================================
           ЭКРАН АВТОРИЗАЦИИ
           ========================================== */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            z-index: 9999;
        }

        .login-box {
            background: var(--glass-bg); padding: 40px; border-radius: 12px;
            text-align: center; border: 1px solid #333; max-width: 90%; width: 350px;
        }

        .login-box h1 { margin-bottom: 20px; font-weight: 300; }
        
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
            border: 1px solid #444; background: #111; color: white; font-size: 16px; outline: none;
        }

        button.btn-primary {
            width: 100%; padding: 12px; background-color: var(--primary-color);
            color: white; border: none; border-radius: 6px; font-size: 16px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button.btn-primary:hover { background-color: #b20710; }

        /* ==========================================
           ОСНОВНОЙ ЭКРАН (ГЛАВНЫЙ МАКЕТ)
           ========================================== */
        #app-screen {
            display: none; flex-direction: column; height: 100dvh; width: 100vw;
        }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ (ССЫЛКА И СУБТИТРЫ) */
        #controls-panel {
            display: flex; gap: 10px; padding: 10px; background: #111;
            align-items: center; flex-shrink: 0; border-bottom: 1px solid #222;
        }
        #controls-panel input[type="text"] { margin-bottom: 0; flex-grow: 1; padding: 10px; }
        #controls-panel button { width: auto; padding: 10px 15px; margin-bottom: 0; }
        
        .subtitles-label {
            background: #222; padding: 10px 15px; border-radius: 6px; border: 1px solid #444;
            cursor: pointer; font-size: 14px; white-space: nowrap;
        }
        .subtitles-label:hover { background: #333; }
        input[type="file"] { display: none; }

        /* КОНТЕЙНЕР ПЛЕЕРА */
        #player-container {
            width: 100%; position: relative; flex-shrink: 0;
            background: black; aspect-ratio: 16 / 9;
        }
        #html5-player { width: 100%; height: 100%; object-fit: contain; }
        #yt-player { width: 100%; height: 100%; display: none; }

        /* ==========================================
           ЧАТ И ЛОГИКА ОРИЕНТАЦИИ (ВЕРТИКАЛЬ/ГОРИЗОНТАЛЬ)
           ========================================== */
        #chat-section {
            flex: 1; display: flex; flex-direction: column; background: #0a0a0a;
            position: relative; overflow: hidden;
        }
        
        .chat-header-landscape { display: none; }

        #chat-messages {
            flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            /* Обеспечиваем скролл сообщений, не дергая страницу */
            overscroll-behavior-y: contain; 
        }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg.my-msg { background: var(--primary-color); align-self: flex-end; border-bottom-right-radius: 2px;}
        .msg.other-msg { background: #333; align-self: flex-start; border-bottom-left-radius: 2px;}
        .msg-name { font-size: 11px; color: #bbb; margin-bottom: 4px; }

        #chat-input-area {
            display: flex; padding: 10px; border-top: 1px solid #222; background: #111; flex-shrink: 0;
        }
        #chat-input-area input { margin-bottom: 0; flex-grow: 1; border-radius: 20px; padding: 10px 15px; }
        #chat-input-area button { width: auto; margin-left: 8px; padding: 8px 16px; border-radius: 20px; }

        /* ПЛАВАЮЩАЯ КНОПКА (Скрыта в вертикальном режиме) */
        #chat-float-btn {
            display: none; position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: rgba(30, 30, 30, 0.8); border: 2px solid #555; border-radius: 50%;
            align-items: center; justify-content: center; font-size: 24px; cursor: pointer;
            z-index: 200; backdrop-filter: blur(10px); user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7); touch-action: none;
        }
        #chat-badge {
            position: absolute; top: -2px; right: -2px; width: 16px; height: 16px;
            background: var(--primary-color); border-radius: 50%; display: none; border: 2px solid #222;
        }

        /* ------------------------------------------
           АДАПТАЦИЯ ДЛЯ ГОРИЗОНТАЛЬНОГО РЕЖИМА И ПК
           ------------------------------------------ */
        @media (orientation: landscape) {
            /* Скрываем панель управления и элементы ввода */
            #controls-panel { display: none !important; }

            /* Плеер занимает ВЕСЬ экран */
            #player-container {
                position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
                z-index: 10; aspect-ratio: auto;
            }

            /* Показываем плавающую кнопку */
            #chat-float-btn { display: flex; }

            /* Превращаем блок чата во всплывающее оверлей-окно */
            #chat-section {
                display: none; /* Скрыто по умолчанию до клика */
                position: fixed; bottom: 100px; right: 30px; width: 340px; height: 60vh;
                border: 1px solid #444; border-radius: 12px; background: rgba(15, 15, 15, 0.85);
                backdrop-filter: blur(15px); z-index: 250; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            }
            #chat-section.show-overlay { display: flex !important; }

            /* Показываем шапку чата с крестиком закрытия */
            .chat-header-landscape {
                display: flex; justify-content: space-between; padding: 12px 15px;
                background: rgba(0,0,0,0.4); border-bottom: 1px solid #444; border-radius: 12px 12px 0 0;
                font-weight: bold; align-items: center;
            }
            #close-chat-btn {
                background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; padding: 0; margin: 0;
            }
            #close-chat-btn:hover { color: white; }
            #chat-input-area { background: rgba(0,0,0,0.5); border-radius: 0 0 12px 12px; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Кино для двоих 🍿</h1>
            <input type="text" id="username" placeholder="Ваше имя">
            <input type="password" id="password" placeholder="Секретный пароль">
            <button class="btn-primary" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="app-screen">
        
        <!-- Верхняя панель: ссылка и субтитры (скрывается в Landscape) -->
        <div id="controls-panel">
            <input type="text" id="video-url" placeholder="Ссылка на YouTube или .mp4">
            <button class="btn-primary" onclick="loadVideoUrl()">Смотреть</button>
            <label class="subtitles-label">
                + Субтитры (.vtt)
                <input type="file" accept=".vtt" id="subtitles-input" onchange="loadSubtitles(event)">
            </label>
        </div>

        <!-- Область плеера -->
        <div id="player-container">
            <video id="html5-player" playsinline controls></video>
            <div id="yt-player"></div>
        </div>

        <!-- Область чата (Внизу в Portrait, Оверлей в Landscape) -->
        <div id="chat-section">
            <div class="chat-header-landscape">
                <span>Чат</span>
                <button id="close-chat-btn" onclick="toggleLandscapeChat()">×</button>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Написать..." onkeypress="handleChatEnter(event)">
                <button class="btn-primary" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- Плавающая кнопка (Видна только в Landscape) -->
        <div id="chat-float-btn">
            💬
            <div id="chat-badge"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ И ИНИЦИАЛИЗАЦИЯ
        // ==========================================
        const CORRECT_PASSWORD = "love123";

        // Ваша конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBatXdgIXXW5c4VFibd24bhoAockReJPrE",
            authDomain: "our-cinema-20c0f.firebaseapp.com",
            databaseURL: "https://our-cinema-20c0f-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "our-cinema-20c0f",
            storageBucket: "our-cinema-20c0f.firebasestorage.app",
            messagingSenderId: "970156344935",
            appId: "1:970156344935:web:74ecce58fb40f4579636c2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const syncRef = db.ref('sync');
        const chatRef = db.ref('chat');

        // Глобальные переменные
        let currentUser = "Аноним";
        let myClientId = Math.random().toString(36).substring(2, 15); // Уникальный ID для защиты от "эха"
        let isSyncing = false; // Флаг, предотвращающий отправку событий во время их применения
        let activeMode = 'html5'; // 'html5' или 'youtube'
        
        // Элементы
        const html5Player = document.getElementById('html5-player');
        let ytPlayer = null;

        // ==========================================
        // ЛОГИКА АВТОРИЗАЦИИ
        // ==========================================
        function login() {
            const passInput = document.getElementById('password').value;
            const nameInput = document.getElementById('username').value.trim();

            if (passInput !== CORRECT_PASSWORD) {
                alert("Неверный пароль! 💔");
                return;
            }

            if (nameInput) currentUser = nameInput;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';

            // Принудительно инициируем HTML5 плеер для iOS
            html5Player.load();

            initFirebaseSync();
            initChat();
        }

        // ==========================================
        // ЛОГИКА ПЛЕЕРОВ (YouTube + HTML5)
        // ==========================================
        
        // Проверка готовности YouTube API
        function onYouTubeIframeAPIReady() {
            // API загружено, плеер создадим позже при необходимости
        }

        // Парсер ссылок YouTube
        function getYTVideoId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&]{11})/);
            return match ? match[1] : null;
        }

        // Пользователь ввел ссылку и нажал "Смотреть"
        function loadVideoUrl() {
            const url = document.getElementById('video-url').value.trim();
            if(!url) return;
            broadcastState(url, true, 0); // Отправляем всем команду загрузить и играть
        }

        // Переключение плеера в зависимости от ссылки
        function applyVideoUrl(url) {
            const ytId = getYTVideoId(url);
            if (ytId) {
                activeMode = 'youtube';
                html5Player.style.display = 'none';
                html5Player.pause();
                document.getElementById('yt-player').style.display = 'block';
                
                if (ytPlayer && ytPlayer.loadVideoById) {
                    ytPlayer.loadVideoById(ytId);
                } else {
                    ytPlayer = new YT.Player('yt-player', {
                        videoId: ytId,
                        playerVars: { 'playsinline': 1, 'controls': 1 },
                        events: { 'onStateChange': onYtStateChange }
                    });
                }
            } else {
                activeMode = 'html5';
                document.getElementById('yt-player').style.display = 'none';
                if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
                html5Player.style.display = 'block';
                
                if (html5Player.src !== url) {
                    html5Player.src = url;
                    html5Player.load();
                }
            }
        }

        // ==========================================
        // СИНХРОНИЗАЦИЯ ЧЕРЕЗ FIREBASE (EQUAL CONTROL)
        // ==========================================

        function getActiveTime() {
            if (activeMode === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime();
            return html5Player.currentTime || 0;
        }

        function broadcastState(url, isPlaying, time) {
            if (isSyncing) return; // Если мы сами применяем чужую команду, не отправляем эхо
            
            syncRef.set({
                url: url,
                isPlaying: isPlaying,
                time: time,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                sender: myClientId
            });
        }

        // Локальные события HTML5 плеера
        html5Player.addEventListener('play', () => broadcastState(html5Player.src, true, html5Player.currentTime));
        html5Player.addEventListener('pause', () => broadcastState(html5Player.src, false, html5Player.currentTime));
        html5Player.addEventListener('seeked', () => broadcastState(html5Player.src, !html5Player.paused, html5Player.currentTime));

        // Локальные события YouTube плеера
        function onYtStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) broadcastState(ytPlayer.getVideoUrl(), true, ytPlayer.getCurrentTime());
            if (event.data === YT.PlayerState.PAUSED) broadcastState(ytPlayer.getVideoUrl(), false, ytPlayer.getCurrentTime());
        }

        // Прослушивание команд от Firebase
        function initFirebaseSync() {
            let currentLoadedUrl = "";

            syncRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                // Игнорируем свои же обновления
                if (data.sender === myClientId) return;

                isSyncing = true; // Включаем блокировку эха

                // 1. Смена ссылки
                if (data.url && data.url !== currentLoadedUrl) {
                    currentLoadedUrl = data.url;
                    applyVideoUrl(data.url);
                }

                // Вспомогательная функция для применения времени и статуса
                const applyPlayPauseSeek = () => {
                    const localTime = getActiveTime();
                    
                    // 2. Синхронизация времени (если разрыв больше 1.5 сек)
                    if (Math.abs(localTime - data.time) > 1.5) {
                        if (activeMode === 'youtube' && ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(data.time, true);
                        if (activeMode === 'html5') html5Player.currentTime = data.time;
                    }

                    // 3. Синхронизация Play/Pause
                    if (activeMode === 'youtube' && ytPlayer && ytPlayer.getPlayerState) {
                        const state = ytPlayer.getPlayerState();
                        if (data.isPlaying && state !== YT.PlayerState.PLAYING) ytPlayer.playVideo();
                        if (!data.isPlaying && state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
                    }
                    if (activeMode === 'html5') {
                        if (data.isPlaying && html5Player.paused) html5Player.play().catch(()=>{});
                        if (!data.isPlaying && !html5Player.paused) html5Player.pause();
                    }
                };

                // Ждем чуть-чуть, если плеер только инициализируется
                setTimeout(() => {
                    applyPlayPauseSeek();
                    // Снимаем блокировку эха после применения
                    setTimeout(() => isSyncing = false, 500);
                }, 100);
            });
        }

        // ==========================================
        // СУБТИТРЫ (Только для HTML5)
        // ==========================================
        function loadSubtitles(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (activeMode === 'youtube') {
                alert("Субтитры из файла работают только для прямых .mp4 ссылок, а не для YouTube.");
                return;
            }

            const objectURL = URL.createObjectURL(file);
            let track = document.getElementById('custom-subtitles');
            if (!track) {
                track = document.createElement('track');
                track.id = 'custom-subtitles';
                track.kind = 'subtitles';
                track.label = 'Русский';
                track.srclang = 'ru';
                html5Player.appendChild(track);
            }

            track.src = objectURL;
            track.default = true;

            setTimeout(() => {
                if(html5Player.textTracks && html5Player.textTracks.length > 0) {
                    html5Player.textTracks[0].mode = 'showing';
                }
            }, 500);
        }

        // ==========================================
        // ЛОГИКА ЧАТА И ОВЕРЛЕЯ
        // ==========================================
        const messagesDiv = document.getElementById('chat-messages');
        const badge = document.getElementById('chat-badge');
        const chatSection = document.getElementById('chat-section');
        const chatInput = document.getElementById('chat-input');

        function toggleLandscapeChat() {
            chatSection.classList.toggle('show-overlay');
            if (chatSection.classList.contains('show-overlay')) {
                badge.style.display = 'none'; // Скрываем красную точку
                scrollToBottom();
                setTimeout(() => chatInput.focus(), 100); // Фокус на поле ввода
            }
        }

        function isLandscapeChatOpen() {
            return chatSection.classList.contains('show-overlay');
        }

        function isLandscapeMode() {
            return window.matchMedia("(orientation: landscape)").matches;
        }

        function initChat() {
            chatRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const div = document.createElement('div');
                div.classList.add('msg');
                div.classList.add(msg.sender === currentUser ? 'my-msg' : 'other-msg');
                
                const nameSpan = document.createElement('div');
                nameSpan.classList.add('msg-name');
                nameSpan.innerText = msg.sender;
                
                const textSpan = document.createElement('span');
                textSpan.innerText = msg.text;

                div.appendChild(nameSpan);
                div.appendChild(textSpan);
                messagesDiv.appendChild(div);
                
                scrollToBottom();

                // Если мы в горизонтальном режиме, чат закрыт и написал кто-то другой - показываем точку
                if (isLandscapeMode() && !isLandscapeChatOpen() && msg.sender !== currentUser) {
                    badge.style.display = 'block';
                }
            });
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === "") return;

            chatRef.push({
                sender: currentUser,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            chatInput.value = "";
            chatInput.focus();
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ==========================================
        // DRAG & DROP ПЛАВАЮЩЕЙ КНОПКИ
        // ==========================================
        const floatBtn = document.getElementById('chat-float-btn');
        let isDragging = false;
        let isMoved = false;
        let startX, startY, initialLeft, initialTop;

        const dragStart = (e) => {
            isDragging = true;
            isMoved = false; 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            startX = clientX;
            startY = clientY;
            
            const rect = floatBtn.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            // Переводим позиционирование в left/top для плавности перетаскивания
            floatBtn.style.left = initialLeft + 'px';
            floatBtn.style.top = initialTop + 'px';
            floatBtn.style.right = 'auto';
            floatBtn.style.bottom = 'auto';
        };

        const dragMove = (e) => {
            if (!isDragging) return;
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const diffX = clientX - startX;
            const diffY = clientY - startY;

            if (Math.abs(diffX) > 5 || Math.abs(diffY) > 5) {
                isMoved = true;
            }

            if (isMoved) {
                e.preventDefault(); 
                let newLeft = initialLeft + diffX;
                let newTop = initialTop + diffY;
                
                newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - floatBtn.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, window.innerHeight - floatBtn.offsetHeight));

                floatBtn.style.left = newLeft + 'px';
                floatBtn.style.top = newTop + 'px';
            }
        };

        const dragEnd = (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            // Если не перетаскивали, а просто кликнули
            if (!isMoved) {
                toggleLandscapeChat();
            }
        };

        // События мыши и сенсора
        floatBtn.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove, { passive: false });
        document.addEventListener('mouseup', dragEnd);

        floatBtn.addEventListener('touchstart', dragStart, { passive: false });
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);

    </script>
</body>
</html>
