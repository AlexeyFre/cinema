<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Наш Кинотеатр ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #11111a;
    --surface2: #181825;
    --border: rgba(255,255,255,0.07);
    --accent: #c9a96e;
    --accent2: #e8c99a;
    --text: #e8e4dc;
    --text-dim: #7a7870;
    --text-muted: #4a4840;
    --red: #c96e6e;
    --green: #6ec9a9;
    --chat-w: 320px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* ─── PASSWORD SCREEN ─────────────────────────────── */
  #lock-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
  }
  .lock-hearts {
    font-size: 40px;
    letter-spacing: 8px;
    animation: heartbeat 2s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.12); opacity: 1; }
  }
  .lock-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 6vw, 42px);
    font-weight: 300;
    color: var(--accent);
    letter-spacing: .05em;
    text-align: center;
  }
  .lock-subtitle {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .lock-form {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    width: 260px;
  }
  .lock-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    letter-spacing: .2em;
    text-align: center;
    outline: none;
    transition: border-color .2s;
  }
  .lock-input:focus { border-color: var(--accent); }
  .lock-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 8px;
    padding: 14px;
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .lock-btn:active { transform: scale(.97); opacity: .9; }
  .lock-error {
    color: var(--red);
    font-size: 11px;
    letter-spacing: .1em;
    min-height: 16px;
    text-align: center;
  }

  /* ─── MAIN LAYOUT ─────────────────────────────────── */
  #app {
    display: none;
    height: 100%;
    height: 100dvh;
  }
  #app.visible { display: flex; }

  /* DESKTOP: side-by-side */
  @media (min-width: 768px) {
    #app { flex-direction: row; }
    #video-col {
      flex: 1;
      display: flex; flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    #chat-col {
      width: var(--chat-w);
      flex-shrink: 0;
      display: flex; flex-direction: column;
      border-left: 1px solid var(--border);
      background: var(--surface);
    }
    #mobile-chat-toggle { display: none !important; }
    #chat-drawer-backdrop { display: none !important; }
  }

  /* MOBILE: stacked, chat is drawer */
  @media (max-width: 767px) {
    #app { flex-direction: column; }
    #video-col {
      flex: 1;
      display: flex; flex-direction: column;
      min-width: 0; min-height: 0;
    }
    #chat-col {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      z-index: 800;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      display: flex; flex-direction: column;
      transform: translateY(calc(100% - 56px));
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      max-height: 80dvh;
    }
    #chat-col.drawer-open {
      transform: translateY(0);
    }
    #chat-drawer-backdrop {
      display: none;
      position: fixed; inset: 0; z-index: 799;
      background: rgba(0,0,0,.5);
    }
    #chat-drawer-backdrop.visible { display: block; }
  }

  /* ─── VIDEO COLUMN ─────────────────────────────────── */
  #video-col {
    background: #000;
  }

  /* top bar */
  #top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 10px;
  }
  .tb-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 300; font-style: italic;
    color: var(--accent);
    white-space: nowrap;
  }
  .tb-logo span { color: var(--text-dim); font-size: 14px; margin-left: 4px; }
  #url-form {
    display: flex; flex: 1; gap: 8px; min-width: 0;
  }
  #url-input {
    flex: 1; min-width: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    outline: none;
    transition: border-color .2s;
  }
  #url-input:focus { border-color: var(--accent); }
  #url-input::placeholder { color: var(--text-muted); }

  .tb-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .2s, border-color .2s, background .2s;
    flex-shrink: 0;
  }
  .tb-btn:hover { color: var(--accent); border-color: var(--accent); }
  .tb-btn.accent {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }
  .tb-btn.accent:hover { background: var(--accent2); border-color: var(--accent2); }

  /* VTT row */
  #vtt-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #vtt-row label {
    color: var(--text-dim); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; white-space: nowrap;
  }
  #vtt-input {
    flex: 1; min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 3px 4px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    outline: none;
  }
  #vtt-input:focus { border-bottom-color: var(--accent); }
  #vtt-input::placeholder { color: var(--text-muted); }

  /* player wrapper */
  #player-wrap {
    flex: 1; position: relative;
    background: #000;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #video-el {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
  }
  #yt-frame {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: none;
    pointer-events: auto;
  }
  #player-placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    color: var(--text-muted);
    pointer-events: none;
    text-align: center;
    padding: 24px;
  }
  .placeholder-icon { font-size: 48px; opacity: .3; }
  .placeholder-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 300; font-style: italic;
    color: var(--text-dim);
  }
  .placeholder-sub { font-size: 11px; color: var(--text-muted); letter-spacing: .1em; }

  /* custom video controls */
  #controls {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ctrl-btn {
    background: none; border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    transition: color .15s, background .15s;
    flex-shrink: 0;
    line-height: 1;
    -webkit-user-select: none; user-select: none;
  }
  .ctrl-btn:hover { color: var(--accent); background: rgba(201,169,110,.08); }
  .ctrl-btn:active { transform: scale(.9); }

  #progress-wrap {
    flex: 1; position: relative;
    height: 20px; display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  #progress-track {
    width: 100%; height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    position: relative; overflow: visible;
  }
  #progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width .1s linear;
    pointer-events: none;
  }
  #progress-thumb {
    position: absolute; top: 50%;
    width: 12px; height: 12px;
    background: var(--accent2);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    left: 0%;
    box-shadow: 0 0 6px rgba(201,169,110,.5);
    pointer-events: none;
    transition: left .1s linear;
  }
  #time-display {
    font-size: 11px; color: var(--text-dim);
    white-space: nowrap; flex-shrink: 0;
    min-width: 90px; text-align: right;
  }
  #vol-wrap {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  #vol-slider {
    -webkit-appearance: none; appearance: none;
    width: 60px; height: 3px;
    background: var(--surface2);
    border-radius: 2px; outline: none;
    cursor: pointer;
  }
  #vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* sync status pill */
  #sync-pill {
    position: absolute;
    top: 12px; left: 12px;
    background: rgba(10,10,15,.8);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 10px;
    letter-spacing: .1em;
    display: flex; align-items: center; gap: 6px;
    pointer-events: none;
    transition: opacity .5s;
    z-index: 10;
  }
  .sync-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse-dot 2s infinite;
  }
  .sync-dot.warn { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .sync-dot.err { background: var(--red); box-shadow: 0 0 6px var(--red); animation: none; }
  @keyframes pulse-dot {
    0%,100% { opacity: 1; } 50% { opacity: .3; }
  }

  /* ─── CHAT COLUMN ─────────────────────────────────── */
  #chat-drag-handle {
    display: none;
    padding: 12px 0 8px;
    cursor: grab; flex-shrink: 0;
    align-items: center; justify-content: center;
  }
  @media (max-width: 767px) {
    #chat-drag-handle { display: flex; }
  }
  .drag-bar {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
  }

  /* mobile peek row — always visible at bottom */
  #chat-peek-row {
    display: none;
    align-items: center; justify-content: space-between;
    padding: 0 14px 10px;
    flex-shrink: 0;
  }
  @media (max-width: 767px) {
    #chat-peek-row { display: flex; }
  }
  .peek-label {
    font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
  }
  #chat-unread-badge {
    background: var(--accent);
    color: var(--bg);
    border-radius: 10px;
    padding: 2px 7px;
    font-size: 10px;
    display: none;
  }
  #chat-unread-badge.visible { display: inline-block; }

  /* chat header (desktop) */
  #chat-header {
    padding: 16px; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  @media (max-width: 767px) {
    #chat-header { display: none; }
  }
  .ch-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px; font-weight: 300; font-style: italic;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .ch-partner {
    font-size: 10px; color: var(--text-muted);
    letter-spacing: .1em;
  }
  .ch-status-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 4px var(--green);
    margin-right: 4px;
    animation: pulse-dot 2s infinite;
  }

  /* messages area */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 12px;
    display: flex; flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
    min-height: 0;
    -webkit-overflow-scrolling: touch;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    max-width: 85%;
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .msg.me { align-self: flex-end; align-items: flex-end; }
  .msg.them { align-self: flex-start; align-items: flex-start; }
  .msg-bubble {
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg.me .msg-bubble {
    background: linear-gradient(135deg, rgba(201,169,110,.25), rgba(232,201,154,.15));
    border: 1px solid rgba(201,169,110,.25);
    border-bottom-right-radius: 4px;
    color: var(--text);
  }
  .msg.them .msg-bubble {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }
  .msg-time {
    font-size: 9px; color: var(--text-muted);
    letter-spacing: .05em;
  }
  .msg.system {
    align-self: center; max-width: 100%;
    align-items: center;
  }
  .msg.system .msg-bubble {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    font-style: italic;
    padding: 2px 8px;
    text-align: center;
  }

  /* chat input */
  #chat-input-wrap {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px;
    padding-bottom: calc(10px + var(--safe-b));
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  #chat-name-sel {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    outline: none;
    flex-shrink: 0;
    cursor: pointer;
  }
  #chat-name-sel option { background: var(--surface); }
  #chat-textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.4;
    resize: none;
    outline: none;
    max-height: 100px;
    overflow-y: auto;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  #chat-textarea:focus { border-color: rgba(201,169,110,.4); }
  #chat-textarea::placeholder { color: var(--text-muted); }
  #send-btn {
    background: var(--accent);
    border: none; border-radius: 10px;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    font-size: 16px;
    transition: background .15s, transform .1s;
  }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:active { transform: scale(.9); }

  /* ─── REACTIONS ───────────────────────────────────── */
  #reactions-bar {
    display: flex; gap: 6px;
    padding: 6px 12px 0;
    flex-shrink: 0;
  }
  .react-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 16px; cursor: pointer;
    transition: border-color .15s, transform .1s, background .15s;
  }
  .react-btn:hover { border-color: var(--accent); background: rgba(201,169,110,.08); }
  .react-btn:active { transform: scale(.85); }

  /* floating reaction pop */
  .float-reaction {
    position: fixed;
    font-size: 28px;
    pointer-events: none;
    z-index: 9000;
    animation: floatUp 1.8s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
  }

  /* ─── MISC ────────────────────────────────────────── */
  .hidden { display: none !important; }

  /* toast */
  #toast {
    position: fixed;
    bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 12px;
    color: var(--text-dim);
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    z-index: 9999;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* scrollbar global */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  /* iOS keyboard safe area handled via JS + CSS var */
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    #chat-input-wrap {
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-hearts">❤️</div>
  <div>
    <div class="lock-title">Наш Кинотеатр</div>
    <div class="lock-subtitle" style="text-align:center;margin-top:6px;">Только для двоих</div>
  </div>
  <div class="lock-form">
    <input class="lock-input" type="password" id="pass-input" placeholder="••••••••" autocomplete="current-password">
    <button class="lock-btn" id="pass-btn">Войти →</button>
    <div class="lock-error" id="pass-err"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">

  <!-- VIDEO COLUMN -->
  <div id="video-col">

    <!-- Top bar -->
    <div id="top-bar">
      <div class="tb-logo">Cinéma <span>❤</span></div>
      <div id="url-form">
        <input id="url-input" type="url" placeholder="Ссылка на фильм (mp4 / YouTube)…">
        <button class="tb-btn accent" id="load-btn">▶ Загрузить</button>
      </div>
    </div>

    <!-- Subtitle row -->
    <div id="vtt-row">
      <label>Субтитры</label>
      <input id="vtt-input" type="url" placeholder="Ссылка на .vtt файл (необязательно)">
      <button class="tb-btn" id="vtt-btn" style="font-size:10px;">Применить</button>
    </div>

    <!-- Player -->
    <div id="player-wrap">
      <div id="player-placeholder">
        <div class="placeholder-icon">🎬</div>
        <div class="placeholder-text">Добавьте фильм, чтобы начать</div>
        <div class="placeholder-sub">Поддерживаются MP4, M4V и YouTube</div>
      </div>
      <video id="video-el" playsinline webkit-playsinline preload="metadata"></video>
      <div id="yt-frame"></div>
      <div id="sync-pill">
        <div class="sync-dot" id="sync-dot"></div>
        <span id="sync-label">Синхронизация</span>
      </div>
    </div>

    <!-- Controls -->
    <div id="controls">
      <button class="ctrl-btn" id="play-btn" title="Play/Pause">▶</button>
      <button class="ctrl-btn" id="back-btn" title="-10с">«</button>
      <button class="ctrl-btn" id="fwd-btn" title="+10с">»</button>

      <div id="progress-wrap" id="progress-wrap">
        <div id="progress-track">
          <div id="progress-fill"></div>
          <div id="progress-thumb"></div>
        </div>
      </div>

      <div id="time-display">0:00 / 0:00</div>

      <div id="vol-wrap">
        <button class="ctrl-btn" id="mute-btn">🔊</button>
        <input type="range" id="vol-slider" min="0" max="1" step="0.02" value="1">
      </div>

      <button class="ctrl-btn" id="fs-btn" title="Полный экран">⛶</button>
    </div>

  </div><!-- /video-col -->

  <!-- CHAT DRAWER BACKDROP (mobile) -->
  <div id="chat-drawer-backdrop"></div>

  <!-- CHAT COLUMN -->
  <div id="chat-col" id="chat-col">

    <!-- Mobile drag handle + peek -->
    <div id="chat-drag-handle"><div class="drag-bar"></div></div>
    <div id="chat-peek-row">
      <div class="peek-label">
        💬 Чат
        <span id="chat-unread-badge">0</span>
      </div>
      <div style="font-size:10px;color:var(--text-muted)">↑ потяните</div>
    </div>

    <!-- Desktop header -->
    <div id="chat-header">
      <div class="ch-title">Чат</div>
      <div class="ch-partner"><span class="ch-status-dot"></span>Партнёр онлайн</div>
    </div>

    <!-- Reactions -->
    <div id="reactions-bar">
      <button class="react-btn" data-emoji="❤️">❤️</button>
      <button class="react-btn" data-emoji="😂">😂</button>
      <button class="react-btn" data-emoji="😱">😱</button>
      <button class="react-btn" data-emoji="👏">👏</button>
      <button class="react-btn" data-emoji="🍿">🍿</button>
    </div>

    <!-- Messages -->
    <div id="messages"></div>

    <!-- Input -->
    <div id="chat-input-wrap">
      <select id="chat-name-sel">
        <option value="Я">Я</option>
        <option value="Ты">Ты</option>
      </select>
      <textarea id="chat-textarea" rows="1" placeholder="Сообщение…"></textarea>
      <button id="send-btn">➤</button>
    </div>

  </div><!-- /chat-col -->

</div><!-- /app -->

<div id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, set, onValue, push, serverTimestamp, onDisconnect }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyBatXdgIXXW5c4VFibd24bhoAockReJPrE",
  authDomain: "our-cinema-20c0f.firebaseapp.com",
  projectId: "our-cinema-20c0f",
  storageBucket: "our-cinema-20c0f.firebasestorage.app",
  messagingSenderId: "970156344935",
  databaseURL: "https://our-cinema-20c0f-default-rtdb.firebaseio.com",
  appId: "1:970156344935:web:74ecce58fb40f4579636c2"
};

// ─── INIT ──────────────────────────────────────────────
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

const syncRef   = ref(db, 'cinema/sync');
const chatRef   = ref(db, 'cinema/chat');
const presRef   = ref(db, 'cinema/presence/' + Math.random().toString(36).slice(2));

// Password gate
const PASS = 'love123';
document.getElementById('pass-btn').onclick = tryUnlock;
document.getElementById('pass-input').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
function tryUnlock() {
  const v = document.getElementById('pass-input').value;
  if (v === PASS) {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    initApp();
  } else {
    const err = document.getElementById('pass-err');
    err.textContent = 'Неверный пароль ✕';
    document.getElementById('pass-input').value = '';
    document.getElementById('pass-input').focus();
    setTimeout(() => { err.textContent = ''; }, 2000);
  }
}

// ─── STATE ─────────────────────────────────────────────
let ytPlayer = null;
let isYT = false;
let isSeeking = false;
let lastSyncTime = 0;
let suppressSync = false;
let drawerOpen = false;
let unreadCount = 0;
const SYNC_THRESHOLD = 2; // seconds drift before force-seek

function initApp() {
  initPlayerControls();
  initChat();
  initSync();
  initPresence();
  initDrawer();
  initKeyboardHandling();
}

// ─── VIDEO ELEMENT REF ─────────────────────────────────
const vid = document.getElementById('video-el');
const ytDiv = document.getElementById('yt-frame');
const placeholder = document.getElementById('player-placeholder');
const playBtn = document.getElementById('play-btn');
const progressFill = document.getElementById('progress-fill');
const progressThumb = document.getElementById('progress-thumb');
const timeDisplay = document.getElementById('time-display');
const syncDot = document.getElementById('sync-dot');
const syncLabel = document.getElementById('sync-label');

// ─── LOAD MEDIA ────────────────────────────────────────
document.getElementById('load-btn').onclick = loadMedia;
document.getElementById('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadMedia(); });

function loadMedia() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  const ytId = extractYTId(url);
  if (ytId) loadYT(ytId);
  else loadMP4(url);
  // push URL to sync
  set(syncRef, { url, ytId: ytId || null, playing: false, currentTime: 0, ts: Date.now() });
}

function extractYTId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function loadMP4(src) {
  destroyYT();
  vid.src = src;
  vid.style.display = 'block';
  ytDiv.style.display = 'none';
  placeholder.style.display = 'none';
  isYT = false;
  applyVTT();
}

function loadYT(id) {
  vid.style.display = 'none';
  vid.src = '';
  ytDiv.style.display = 'block';
  placeholder.style.display = 'none';
  isYT = true;
  if (ytPlayer && typeof ytPlayer.destroy === 'function') {
    ytPlayer.destroy();
    ytPlayer = null;
  }
  ytDiv.innerHTML = '<div id="yt-inner"></div>';
  if (window.YT && window.YT.Player) {
    createYTPlayer(id);
  } else {
    window._ytCallback = () => createYTPlayer(id);
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
}

window.onYouTubeIframeAPIReady = () => { if (window._ytCallback) window._ytCallback(); };

function createYTPlayer(id) {
  ytPlayer = new YT.Player('yt-inner', {
    videoId: id,
    width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0 },
    events: {
      onStateChange: onYTState,
      onReady: () => {
        ytDiv.querySelector('iframe').style.cssText = 'width:100%;height:100%;border:0;pointer-events:auto;';
        showToast('YouTube загружен');
      }
    }
  });
}

function destroyYT() {
  if (ytPlayer) { try { ytPlayer.destroy(); } catch(e){} ytPlayer = null; }
  ytDiv.innerHTML = '';
  isYT = false;
}

// ─── SUBTITLES ─────────────────────────────────────────
document.getElementById('vtt-btn').onclick = applyVTT;
function applyVTT() {
  const url = document.getElementById('vtt-input').value.trim();
  if (!url || isYT) return;
  // remove old tracks
  Array.from(vid.querySelectorAll('track')).forEach(t => t.remove());
  const track = document.createElement('track');
  track.kind = 'subtitles';
  track.label = 'Субтитры';
  track.srclang = 'ru';
  track.src = url;
  track.default = true;
  vid.appendChild(track);
  if (vid.textTracks[0]) vid.textTracks[0].mode = 'showing';
  showToast('Субтитры загружены');
}

// ─── PLAYER CONTROLS ───────────────────────────────────
function initPlayerControls() {
  // Play/Pause
  playBtn.onclick = () => togglePlay(true);

  // Skip
  document.getElementById('back-btn').onclick = () => seekRelative(-10);
  document.getElementById('fwd-btn').onclick = () => seekRelative(10);

  // Progress bar
  const wrap = document.getElementById('progress-wrap');
  function seekFromEvent(e) {
    const rect = wrap.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const dur = getDuration();
    if (!dur) return;
    seekTo(pct * dur, true);
  }
  wrap.addEventListener('mousedown', e => { isSeeking = true; seekFromEvent(e); });
  wrap.addEventListener('touchstart', e => { isSeeking = true; seekFromEvent(e); }, { passive: true });
  document.addEventListener('mousemove', e => { if (isSeeking) seekFromEvent(e); });
  document.addEventListener('touchmove', e => { if (isSeeking) seekFromEvent(e); }, { passive: true });
  document.addEventListener('mouseup', () => { isSeeking = false; });
  document.addEventListener('touchend', () => { isSeeking = false; });

  // Volume
  document.getElementById('vol-slider').oninput = e => {
    vid.volume = e.target.value;
    document.getElementById('mute-btn').textContent = e.target.value > 0 ? '🔊' : '🔇';
  };
  document.getElementById('mute-btn').onclick = () => {
    vid.muted = !vid.muted;
    document.getElementById('mute-btn').textContent = vid.muted ? '🔇' : '🔊';
  };

  // Fullscreen
  document.getElementById('fs-btn').onclick = () => {
    const el = document.getElementById('player-wrap');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  };

  // Update UI from video element
  vid.addEventListener('timeupdate', updateProgress);
  vid.addEventListener('play', () => { playBtn.textContent = '⏸'; });
  vid.addEventListener('pause', () => { playBtn.textContent = '▶'; });
  vid.addEventListener('durationchange', updateProgress);

  // Tick for YT
  setInterval(() => {
    if (isYT && ytPlayer && typeof ytPlayer.getCurrentTime === 'function') {
      updateProgressManual(ytPlayer.getCurrentTime(), ytPlayer.getDuration());
    }
  }, 500);
}

function togglePlay(broadcast = false) {
  if (isYT) {
    if (!ytPlayer) return;
    const s = ytPlayer.getPlayerState();
    if (s === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); }
    else { ytPlayer.playVideo(); }
    if (broadcast) pushSync();
  } else {
    if (vid.paused) vid.play().catch(()=>{});
    else vid.pause();
    if (broadcast) pushSync();
  }
}

function onYTState(e) {
  const s = e.data;
  if (s === YT.PlayerState.PLAYING) playBtn.textContent = '⏸';
  else if (s === YT.PlayerState.PAUSED || s === YT.PlayerState.ENDED) playBtn.textContent = '▶';
  if (!suppressSync) pushSync();
}

function getPlaying() {
  if (isYT) return ytPlayer ? ytPlayer.getPlayerState() === YT.PlayerState.PLAYING : false;
  return !vid.paused;
}
function getCurrentTime() {
  if (isYT) return ytPlayer ? ytPlayer.getCurrentTime() : 0;
  return vid.currentTime;
}
function getDuration() {
  if (isYT) return ytPlayer ? ytPlayer.getDuration() : 0;
  return vid.duration || 0;
}
function seekTo(t, broadcast = false) {
  if (isYT) { if (ytPlayer) ytPlayer.seekTo(t, true); }
  else vid.currentTime = t;
  if (broadcast) pushSync();
}
function seekRelative(delta) {
  seekTo(Math.max(0, getCurrentTime() + delta), true);
}

function updateProgress() {
  updateProgressManual(vid.currentTime, vid.duration);
}
function updateProgressManual(cur, dur) {
  if (!dur || isNaN(dur)) return;
  const pct = (cur / dur) * 100;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  timeDisplay.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
}
function fmtTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return m + ':' + String(ss).padStart(2, '0');
}

// ─── SYNC ──────────────────────────────────────────────
let syncPushTimeout = null;
function pushSync() {
  clearTimeout(syncPushTimeout);
  syncPushTimeout = setTimeout(() => {
    const payload = {
      url: document.getElementById('url-input').value.trim(),
      ytId: isYT ? (document.getElementById('url-input').value.trim()) : null,
      playing: getPlaying(),
      currentTime: getCurrentTime(),
      ts: Date.now()
    };
    set(syncRef, payload);
  }, 300);
}

function initSync() {
  onValue(syncRef, snap => {
    const data = snap.val();
    if (!data) return;
    const now = Date.now();
    // Avoid echo: ignore if we wrote recently
    if (Math.abs(now - (data.ts || 0)) < 400) return;
    suppressSync = true;

    // Load new URL if changed
    const curUrl = document.getElementById('url-input').value.trim();
    if (data.url && data.url !== curUrl) {
      document.getElementById('url-input').value = data.url;
      const ytId = extractYTId(data.url);
      if (ytId) loadYT(ytId);
      else loadMP4(data.url);
    }

    // Sync playback state
    const remotePlaying = data.playing;
    const remoteTime = data.currentTime || 0;
    // Latency compensation
    const drift = (now - data.ts) / 1000;
    const adjustedTime = remotePlaying ? remoteTime + drift : remoteTime;

    // Seek if needed
    const localTime = getCurrentTime();
    if (Math.abs(localTime - adjustedTime) > SYNC_THRESHOLD) {
      seekTo(adjustedTime, false);
      setSyncStatus('warn', 'Синхронизация…');
      setTimeout(() => setSyncStatus('ok', 'Синхронизировано'), 1500);
    }

    // Play/pause
    const localPlaying = getPlaying();
    if (remotePlaying !== localPlaying) {
      if (remotePlaying) {
        if (isYT) { if (ytPlayer) ytPlayer.playVideo(); }
        else vid.play().catch(()=>{});
      } else {
        if (isYT) { if (ytPlayer) ytPlayer.pauseVideo(); }
        else vid.pause();
      }
    }

    setTimeout(() => { suppressSync = false; }, 600);
  });
}

function setSyncStatus(state, text) {
  syncLabel.textContent = text;
  syncDot.className = 'sync-dot' + (state === 'warn' ? ' warn' : state === 'err' ? ' err' : '');
}

// ─── HEARTBEAT SYNC ────────────────────────────────────
setInterval(() => {
  if (getPlaying()) pushSync();
}, 5000);

// ─── PRESENCE ─────────────────────────────────────────
function initPresence() {
  set(presRef, { online: true, ts: serverTimestamp() });
  onDisconnect(presRef).remove();
}

// ─── CHAT ─────────────────────────────────────────────
function initChat() {
  const textarea = document.getElementById('chat-textarea');
  const sendBtn = document.getElementById('send-btn');

  sendBtn.onclick = sendMessage;
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
  });

  // Reactions
  document.querySelectorAll('.react-btn').forEach(btn => {
    btn.onclick = () => {
      const emoji = btn.dataset.emoji;
      const name = document.getElementById('chat-name-sel').value;
      push(chatRef, { type: 'reaction', emoji, sender: name, ts: serverTimestamp() });
      spawnReaction(emoji, btn);
    };
  });

  // Listen
  onValue(chatRef, snap => {
    const msgs = document.getElementById('messages');
    msgs.innerHTML = '';
    const data = snap.val();
    if (!data) return;
    Object.values(data).forEach(m => renderMessage(m));
    msgs.scrollTop = msgs.scrollHeight;
  });

  // Unread badge (mobile only when drawer closed)
  const origOnValue = onValue;
  onValue(chatRef, snap => {
    if (!drawerOpen && window.innerWidth < 768) {
      const badge = document.getElementById('chat-unread-badge');
      unreadCount++;
      badge.textContent = unreadCount;
      badge.classList.add('visible');
    }
  });
}

function sendMessage() {
  const textarea = document.getElementById('chat-textarea');
  const text = textarea.value.trim();
  if (!text) return;
  const name = document.getElementById('chat-name-sel').value;
  push(chatRef, { type: 'msg', text, sender: name, ts: serverTimestamp() });
  textarea.value = '';
  textarea.style.height = 'auto';
}

function renderMessage(m) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  const myName = document.getElementById('chat-name-sel').value;

  if (m.type === 'reaction') {
    div.className = 'msg system';
    div.innerHTML = `<div class="msg-bubble">${m.sender} отправил(а) ${m.emoji}</div>`;
  } else {
    const isMe = m.sender === myName;
    div.className = 'msg ' + (isMe ? 'me' : 'them');
    const time = m.ts ? new Date(m.ts).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }) : '';
    div.innerHTML = `
      <div class="msg-bubble">${escHtml(m.text || '')}</div>
      <div class="msg-time">${isMe ? '' : m.sender + ' · '}${time}</div>`;
  }
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function spawnReaction(emoji, anchor) {
  const rect = anchor.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-reaction';
  el.textContent = emoji;
  el.style.left = (rect.left + rect.width / 2 - 14) + 'px';
  el.style.top = (rect.top - 10) + 'px';
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

// ─── DRAWER (MOBILE) ───────────────────────────────────
function initDrawer() {
  const chatCol = document.getElementById('chat-col');
  const backdrop = document.getElementById('chat-drawer-backdrop');
  const handle = document.getElementById('chat-drag-handle');
  const peekRow = document.getElementById('chat-peek-row');

  function openDrawer() {
    drawerOpen = true;
    chatCol.classList.add('drawer-open');
    backdrop.classList.add('visible');
    unreadCount = 0;
    const badge = document.getElementById('chat-unread-badge');
    badge.textContent = '0';
    badge.classList.remove('visible');
    setTimeout(() => {
      const msgs = document.getElementById('messages');
      msgs.scrollTop = msgs.scrollHeight;
    }, 350);
  }
  function closeDrawer() {
    drawerOpen = false;
    chatCol.classList.remove('drawer-open');
    backdrop.classList.remove('visible');
  }

  handle.addEventListener('click', () => drawerOpen ? closeDrawer() : openDrawer());
  peekRow.addEventListener('click', () => drawerOpen ? closeDrawer() : openDrawer());
  backdrop.addEventListener('click', closeDrawer);

  // Swipe to close
  let startY = 0;
  chatCol.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
  chatCol.addEventListener('touchend', e => {
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 60 && drawerOpen) closeDrawer();
    if (dy < -60 && !drawerOpen) openDrawer();
  }, { passive: true });
}

// ─── iOS KEYBOARD HANDLING ─────────────────────────────
function initKeyboardHandling() {
  if (!window.visualViewport) return;
  const inputWrap = document.getElementById('chat-input-wrap');

  window.visualViewport.addEventListener('resize', () => {
    const vvHeight = window.visualViewport.height;
    const winHeight = window.innerHeight;
    const keyboardHeight = winHeight - vvHeight;
    inputWrap.style.paddingBottom = Math.max(keyboardHeight, 10) + 'px';
    // Scroll messages to bottom
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  });
}

// ─── TOAST ─────────────────────────────────────────────
function showToast(msg, dur = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// Expose for debugging
window._cinema = { pushSync, seekTo, getPlaying };

</script>
