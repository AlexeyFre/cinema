<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кино для двоих 🍿</title>

    <!-- Firebase (Ваши настройки) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        /* ==========================================
           БАЗОВЫЕ СТИЛИ И ОТКЛЮЧЕНИЕ PULL-TO-REFRESH
           ========================================== */
        :root {
            --bg-color: #050505;
            --primary-color: #E50914; /* Красный как в Netflix */
            --text-color: #f1f1f1;
            --glass-bg: rgba(20, 20, 20, 0.85);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Запрет прокрутки страницы, скроллится только чат */
            overscroll-behavior-y: none;
        }

        * { box-sizing: border-box; }

        /* ==========================================
           ЭКРАН АВТОРИЗАЦИИ
           ========================================== */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            z-index: 9999;
        }

        .login-box {
            background: var(--glass-bg); padding: 40px; border-radius: 12px;
            text-align: center; border: 1px solid #333; max-width: 90%; width: 350px;
        }

        .login-box h1 { margin-bottom: 20px; font-weight: 300; }
        
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px;
            border: 1px solid #444; background: #111; color: white; font-size: 16px; outline: none;
        }

        button.btn-primary {
            width: 100%; padding: 12px; background-color: var(--primary-color);
            color: white; border: none; border-radius: 6px; font-size: 16px;
            cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        button.btn-primary:hover { background-color: #b20710; }

        /* ==========================================
           ОСНОВНОЙ ЭКРАН И ПАНЕЛЬ УПРАВЛЕНИЯ
           ========================================== */
        #app-screen {
            display: none; flex-direction: column; height: 100dvh; width: 100vw;
        }

        /* Панель сверху: всегда видима, кроме режима Fullscreen */
        #controls-panel {
            display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; background: #111;
            align-items: center; flex-shrink: 0; border-bottom: 1px solid #333;
            z-index: 10;
        }
        
        #video-url { flex: 1; min-width: 250px; margin-bottom: 0; }
        
        .control-btns {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        
        .control-btns button, .file-label {
            padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer;
            font-size: 14px; font-weight: bold; color: white; white-space: nowrap;
        }
        
        .btn-load { background-color: var(--primary-color); }
        .btn-load:hover { background-color: #b20710; }
        
        .btn-fullscreen { background-color: #444; }
        .btn-fullscreen:hover { background-color: #555; }
        
        .file-label {
            background-color: #2a2a2a; border: 1px solid #444; display: inline-block;
        }
        .file-label:hover { background-color: #3a3a3a; }
        input[type="file"] { display: none; }

        /* ==========================================
           КОНТЕЙНЕР ДЛЯ ВИДЕО И ЧАТА (FULLSCREEN AREA)
           ========================================== */
        #fullscreen-container {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background: #000; overflow: hidden;
        }

        /* Обертка плеера */
        #video-wrapper {
            width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        
        #html5-player { width: 100%; height: 100%; object-fit: contain; }
        #yt-player { width: 100%; height: 100%; display: none; pointer-events: auto; }

        /* ==========================================
           ЧАТ И ЛОГИКА ОРИЕНТАЦИИ (ВЕРТИКАЛЬ/ГОРИЗОНТАЛЬ)
           ========================================== */
        
        /* Чат блок по умолчанию (вертикальный режим) */
        #chat-section {
            flex: 1; display: flex; flex-direction: column; background: #0a0a0a;
            position: relative; border-top: 1px solid #222;
        }
        
        .chat-header { display: none; } /* Скрыто в вертикальном режиме */

        #chat-messages {
            flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            overscroll-behavior-y: contain; /* Прокрутка только внутри чата */
        }

        .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg.my-msg { background: var(--primary-color); align-self: flex-end; border-bottom-right-radius: 2px;}
        .msg.other-msg { background: #333; align-self: flex-start; border-bottom-left-radius: 2px;}
        .msg-name { font-size: 11px; color: #bbb; margin-bottom: 4px; }

        #chat-input-area {
            display: flex; padding: 10px; border-top: 1px solid #222; background: #111; flex-shrink: 0;
        }
        #chat-input-area input { margin-bottom: 0; flex-grow: 1; border-radius: 20px; padding: 10px 15px; }
        #chat-input-area button { width: auto; margin-left: 8px; padding: 8px 16px; border-radius: 20px; background: var(--primary-color); color: white; border: none; font-weight: bold; cursor: pointer; }

        /* ПЛАВАЮЩАЯ КНОПКА (Скрыта в вертикальном режиме) */
        #chat-float-btn {
            display: none; position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: rgba(30, 30, 30, 0.8); border: 2px solid #555; border-radius: 50%;
            align-items: center; justify-content: center; font-size: 24px; cursor: pointer;
            z-index: 900; backdrop-filter: blur(10px); user-select: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); touch-action: none;
        }
        #chat-badge {
            position: absolute; top: -2px; right: -2px; width: 16px; height: 16px;
            background: var(--primary-color); border-radius: 50%; display: none; border: 2px solid #222;
        }

        /* ------------------------------------------
           АДАПТАЦИЯ ДЛЯ ГОРИЗОНТАЛЬНОГО РЕЖИМА И ПК
           ------------------------------------------ */
        @media (orientation: landscape) {
            #fullscreen-container { flex-direction: row; }
            #video-wrapper { flex: 1; height: 100%; aspect-ratio: auto; }
            
            /* Показываем плавающую кнопку */
            #chat-float-btn { display: flex; }

            /* Превращаем блок чата во всплывающее оверлей-окно */
            #chat-section {
                display: none; /* Скрыто до клика по плавающей кнопке */
                position: absolute; bottom: 100px; right: 30px; width: 340px; height: 65vh;
                border: 1px solid #444; border-radius: 12px; background: rgba(15, 15, 15, 0.85);
                backdrop-filter: blur(15px); z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            }
            #chat-section.show-overlay { display: flex !important; }

            /* Показываем шапку чата с крестиком */
            .chat-header {
                display: flex; justify-content: space-between; padding: 12px 15px;
                background: rgba(0,0,0,0.5); border-bottom: 1px solid #444; border-radius: 12px 12px 0 0;
                font-weight: bold; align-items: center; flex-shrink: 0;
            }
            #close-chat-btn {
                background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; padding: 0; margin: 0;
            }
            #close-chat-btn:hover { color: white; }
            #chat-input-area { background: rgba(0,0,0,0.6); border-radius: 0 0 12px 12px; border-top: none; }
        }
        
        /* Скрытие контролов при нативном Fullscreen */
        :fullscreen #controls-panel { display: none; }
        :-webkit-full-screen #controls-panel { display: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Кино для двоих 🍿</h1>
            <input type="text" id="username" placeholder="Ваше имя">
            <input type="password" id="password" placeholder="Секретный пароль">
            <button class="btn-primary" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН -->
    <div id="app-screen">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ: Всегда видима, если не Fullscreen -->
        <div id="controls-panel">
            <input type="text" id="video-url" placeholder="Вставьте ссылку на видео (.mp4 или YouTube)">
            <div class="control-btns">
                <button class="btn-load" onclick="loadVideoUrl()">Загрузить</button>
                <label class="file-label">
                    + Субтитры (.vtt)
                    <input type="file" accept=".vtt" id="subtitles-input" onchange="loadSubtitles(event)">
                </label>
                <button class="btn-fullscreen" onclick="toggleFullscreen()">На весь экран</button>
            </div>
        </div>

        <!-- КОНТЕЙНЕР FULLSCREEN: Видео + Плавающий чат (при развороте занимает весь экран) -->
        <div id="fullscreen-container">
            
            <div id="video-wrapper">
                <video id="html5-player" playsinline controls></video>
                <div id="yt-player"></div>
            </div>

            <!-- Область чата -->
            <div id="chat-section">
                <div class="chat-header">
                    <span>Чат</span>
                    <button id="close-chat-btn" onclick="toggleOverlayChat()">×</button>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Написать..." onkeypress="handleChatEnter(event)">
                    <button onclick="sendMessage()">➤</button>
                </div>
            </div>

            <!-- Плавающая кнопка -->
            <div id="chat-float-btn">
                💬
                <div id="chat-badge"></div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ И ИНИЦИАЛИЗАЦИЯ
        // ==========================================
        const CORRECT_PASSWORD = "love123";

        // Ваша конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBatXdgIXXW5c4VFibd24bhoAockReJPrE",
            authDomain: "our-cinema-20c0f.firebaseapp.com",
            databaseURL: "https://our-cinema-20c0f-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "our-cinema-20c0f",
            storageBucket: "our-cinema-20c0f.firebasestorage.app",
            messagingSenderId: "970156344935",
            appId: "1:970156344935:web:74ecce58fb40f4579636c2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const syncRef = db.ref('sync');
        const chatRef = db.ref('chat');

        let currentUser = "Аноним";
        let myClientId = Math.random().toString(36).substring(2, 15);
        let isSyncing = false; // Блокировка эхо-событий
        let activeMode = 'html5'; // 'html5' или 'youtube'
        
        const html5Player = document.getElementById('html5-player');
        let ytPlayer = null;
        let isYtApiReady = false;

        // ==========================================
        // ЛОГИКА АВТОРИЗАЦИИ
        // ==========================================
        function login() {
            const passInput = document.getElementById('password').value;
            const nameInput = document.getElementById('username').value.trim();

            if (passInput !== CORRECT_PASSWORD) {
                alert("Неверный пароль! 💔");
                return;
            }

            if (nameInput) currentUser = nameInput;

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';

            html5Player.load(); // Инициализация аудиоконтекста для мобильных
            initFirebaseSync();
            initChat();
        }

        // ==========================================
        // FULLSCREEN ЛОГИКА
        // ==========================================
        function toggleFullscreen() {
            const container = document.getElementById('fullscreen-container');
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Пытаемся развернуть контейнер (Android / ПК)
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (html5Player.webkitEnterFullscreen && activeMode === 'html5') {
                    // Резервный вариант для iOS (разворачивается только само видео)
                    html5Player.webkitEnterFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // ==========================================
        // ЛОГИКА ПЛЕЕРОВ (YouTube + HTML5)
        // ==========================================
        function onYouTubeIframeAPIReady() {
            isYtApiReady = true;
        }

        function getYTVideoId(url) {
            const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            return match ? match[1] : null;
        }

        function loadVideoUrl() {
            const url = document.getElementById('video-url').value.trim();
            if(!url) return;
            // Отправляем всем команду загрузить видео
            broadcastState(url, true, 0); 
        }

        function applyVideoUrl(url) {
            const ytId = getYTVideoId(url);
            
            if (ytId) {
                activeMode = 'youtube';
                html5Player.style.display = 'none';
                html5Player.pause();
                document.getElementById('yt-player').style.display = 'block';
                
                if (ytPlayer && ytPlayer.loadVideoById) {
                    ytPlayer.loadVideoById(ytId);
                } else if (isYtApiReady) {
                    ytPlayer = new YT.Player('yt-player', {
                        videoId: ytId,
                        playerVars: { 'playsinline': 1, 'controls': 1, 'rel': 0 },
                        events: { 'onStateChange': onYtStateChange }
                    });
                } else {
                    // Если API еще не загрузилось, ждем полсекунды и пробуем снова
                    setTimeout(() => applyVideoUrl(url), 500);
                }
            } else {
                activeMode = 'html5';
                document.getElementById('yt-player').style.display = 'none';
                if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
                
                html5Player.style.display = 'block';
                if (html5Player.src !== url) {
                    html5Player.src = url;
                    html5Player.load();
                }
            }
        }

        // ==========================================
        // СИНХРОНИЗАЦИЯ ЧЕРЕЗ FIREBASE (РАВНОПРАВНАЯ)
        // ==========================================
        function getActiveTime() {
            if (activeMode === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime();
            return html5Player.currentTime || 0;
        }

        function broadcastState(url, isPlaying, time) {
            if (isSyncing) return; // Защита от "эха"
            
            syncRef.set({
                url: url,
                isPlaying: isPlaying,
                time: time,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                sender: myClientId
            });
        }

        // События HTML5
        html5Player.addEventListener('play', () => broadcastState(html5Player.src, true, html5Player.currentTime));
        html5Player.addEventListener('pause', () => broadcastState(html5Player.src, false, html5Player.currentTime));
        html5Player.addEventListener('seeked', () => broadcastState(html5Player.src, !html5Player.paused, html5Player.currentTime));

        // События YouTube
        function onYtStateChange(event) {
            if (isSyncing) return;
            if (event.data === YT.PlayerState.PLAYING) broadcastState(ytPlayer.getVideoUrl(), true, ytPlayer.getCurrentTime());
            if (event.data === YT.PlayerState.PAUSED) broadcastState(ytPlayer.getVideoUrl(), false, ytPlayer.getCurrentTime());
        }

        // Прием команд от напарника
        function initFirebaseSync() {
            let currentLoadedUrl = "";

            syncRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || data.sender === myClientId) return; // Игнорируем свои же команды

                isSyncing = true; // Блокируем отправку событий

                if (data.url && data.url !== currentLoadedUrl) {
                    currentLoadedUrl = data.url;
                    applyVideoUrl(data.url);
                }

                const applyPlayPauseSeek = () => {
                    const localTime = getActiveTime();
                    
                    // Синхронизируем время (погрешность 1.5 сек)
                    if (Math.abs(localTime - data.time) > 1.5) {
                        if (activeMode === 'youtube' && ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(data.time, true);
                        if (activeMode === 'html5') html5Player.currentTime = data.time;
                    }

                    // Синхронизируем состояние Play/Pause
                    if (activeMode === 'youtube' && ytPlayer && ytPlayer.getPlayerState) {
                        const state = ytPlayer.getPlayerState();
                        if (data.isPlaying && state !== YT.PlayerState.PLAYING) ytPlayer.playVideo();
                        if (!data.isPlaying && state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
                    }
                    if (activeMode === 'html5') {
                        if (data.isPlaying && html5Player.paused) html5Player.play().catch(()=>{});
                        if (!data.isPlaying && !html5Player.paused) html5Player.pause();
                    }
                };

                setTimeout(() => {
                    applyPlayPauseSeek();
                    setTimeout(() => isSyncing = false, 800); // Разблокируем после применения
                }, 100);
            });
        }

        // ==========================================
        // СУБТИТРЫ (Только для HTML5)
        // ==========================================
        function loadSubtitles(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (activeMode === 'youtube') {
                alert("Субтитры из файла работают только для прямых ссылок .mp4!");
                return;
            }

            const objectURL = URL.createObjectURL(file);
            let track = document.getElementById('custom-subtitles');
            if (!track) {
                track = document.createElement('track');
                track.id = 'custom-subtitles';
                track.kind = 'subtitles';
                track.label = 'Русский';
                track.srclang = 'ru';
                html5Player.appendChild(track);
            }

            track.src = objectURL;
            track.default = true;

            setTimeout(() => {
                if(html5Player.textTracks && html5Player.textTracks.length > 0) {
                    html5Player.textTracks[0].mode = 'showing';
                }
            }, 500);
        }

        // ==========================================
        // ЛОГИКА ЧАТА
        // ==========================================
        const messagesDiv = document.getElementById('chat-messages');
        const badge = document.getElementById('chat-badge');
        const chatSection = document.getElementById('chat-section');
        const chatInput = document.getElementById('chat-input');

        function toggleOverlayChat() {
            chatSection.classList.toggle('show-overlay');
            if (chatSection.classList.contains('show-overlay')) {
                badge.style.display = 'none'; 
                scrollToBottom();
                setTimeout(() => chatInput.focus(), 100);
            }
        }

        function isLandscapeMode() {
            // Проверяем, применен ли медиа-запрос для горизонтального режима
            return window.getComputedStyle(document.getElementById('chat-float-btn')).display !== 'none';
        }

        function initChat() {
            chatRef.on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const div = document.createElement('div');
                div.classList.add('msg');
                div.classList.add(msg.sender === currentUser ? 'my-msg' : 'other-msg');
                
                const nameSpan = document.createElement('div');
                nameSpan.classList.add('msg-name');
                nameSpan.innerText = msg.sender;
                
                const textSpan = document.createElement('span');
                textSpan.innerText = msg.text;

                div.appendChild(nameSpan);
                div.appendChild(textSpan);
                messagesDiv.appendChild(div);
                
                scrollToBottom();

                // Показываем красную точку, если мы в landscape, окно закрыто и написал напарник
                if (isLandscapeMode() && !chatSection.classList.contains('show-overlay') && msg.sender !== currentUser) {
                    badge.style.display = 'block';
                }
            });
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (text === "") return;

            chatRef.push({
                sender: currentUser,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            chatInput.value = "";
            chatInput.focus();
        }

        function handleChatEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ==========================================
        // DRAG & DROP ПЛАВАЮЩЕЙ КНОПКИ
        // ==========================================
        const floatBtn = document.getElementById('chat-float-btn');
        let isDragging = false;
        let isMoved = false;
        let startX, startY, initialLeft, initialTop;

        const dragStart = (e) => {
            isDragging = true;
            isMoved = false; 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            startX = clientX;
            startY = clientY;
            
            const rect = floatBtn.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            floatBtn.style.left = initialLeft + 'px';
            floatBtn.style.top = initialTop + 'px';
            floatBtn.style.right = 'auto';
            floatBtn.style.bottom = 'auto';
        };

        const dragMove = (e) => {
            if (!isDragging) return;
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const diffX = clientX - startX;
            const diffY = clientY - startY;

            if (Math.abs(diffX) > 5 || Math.abs(diffY) > 5) {
                isMoved = true;
            }

            if (isMoved) {
                e.preventDefault(); 
                let newLeft = initialLeft + diffX;
                let newTop = initialTop + diffY;
                
                const containerRect = document.getElementById('fullscreen-container').getBoundingClientRect();
                
                newLeft = Math.max(0, Math.min(newLeft, containerRect.width - floatBtn.offsetWidth));
                newTop = Math.max(0, Math.min(newTop, containerRect.height - floatBtn.offsetHeight));

                floatBtn.style.left = newLeft + 'px';
                floatBtn.style.top = newTop + 'px';
            }
        };

        const dragEnd = (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            if (!isMoved) toggleOverlayChat();
        };

        floatBtn.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove, { passive: false });
        document.addEventListener('mouseup', dragEnd);

        floatBtn.addEventListener('touchstart', dragStart, { passive: false });
        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('touchend', dragEnd);

    </script>
</body>
</html>
